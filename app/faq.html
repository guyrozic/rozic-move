  <script type="module">
    import { CUSTOMER_FAQ_ITEMS } from './customer-faq.js';
    const list = document.getElementById('faq-list');
    CUSTOMER_FAQ_ITEMS.forEach((item, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'faq-item';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'faq-q';
      btn.id = `faq-q-${i}`;
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', `faq-a-${i}`);
      btn.appendChild(document.createTextNode(item.q));
      btn.insertAdjacentHTML('beforeend', '<svg aria-hidden="true" class="faq-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 6l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      const ans = document.createElement('div');
      ans.className = 'faq-a';
      ans.id = `faq-a-${i}`;
      ans.setAttribute('role', 'region');
      ans.setAttribute('aria-labelledby', btn.id);
      const inner = document.createElement('div');
      inner.className = 'faq-a-inner';
      item.a.split('\n\n').forEach((para) => {
        const p = document.createElement('p');
        p.textContent = para;
        inner.appendChild(p);
      });
      ans.appendChild(inner);
      wrap.append(btn, ans);
      list.appendChild(wrap);
      btn.addEventListener('click', () => {
        const wasOpen = wrap.classList.contains('open');
        list.querySelectorAll('.faq-item').forEach((el) => {
          el.classList.remove('open');
          el.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) { wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
      });
    });
  </script>
