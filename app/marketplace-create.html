<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROZIC MOVE — פרסום מודעה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style-app.css">
  <style>
    .photo-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .photo-thumb { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-remove { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none; cursor: pointer; font-size: 0.8rem; }
    .photo-add { width: 84px; height: 84px; border-radius: 12px; border: 1.5px dashed var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--text-muted); cursor: pointer; }
  </style>
</head>
<body class="app-body">
  <script src="under-construction-banner.js"></script>
  <div class="step-hero">
    <div class="step-hero-inner">
      <a href="marketplace.html" class="btn-text" style="padding:0; margin-bottom:10px; display:inline-block;">→ יד שנייה חינם</a>
      <h1>פרסום מודעה</h1>
      <p>כמה פרטים קטנים, ותוכלו למסור בקלות למי שגר קרוב.</p>
    </div>
  </div>

  <div class="app-container">
    <div class="app-card">
      <h2>תמונות</h2>
      <p class="app-card-desc">עד 10 תמונות — תמונה ראשונה תוצג ברשימה.</p>
      <div class="photo-grid" id="photo-grid">
        <label class="photo-add">＋<input type="file" id="photo-input" accept="image/*" multiple style="display:none;"></label>
      </div>
      <div id="ai-listing-progress-wrap" class="ai-upload-progress" style="display:none; margin-top:10px;">
        <div class="ai-upload-progress-fill" id="ai-listing-progress-fill" style="width:0%"></div>
      </div>
      <div id="ai-listing-error"></div>
      <button class="btn btn-secondary" id="ai-analyze-listing-btn" style="margin-top:6px;" disabled>נתח תמונות עם AI ✨</button>
    </div>

    <div class="app-card">
      <h2>פרטי הפריט</h2>
      <div id="ai-filled-badge" class="alert alert-success" style="display:none;">✓ AI מילא עבורך את הפרטים למטה — אפשר לערוך</div>
      <div class="form-group">
        <label for="title">כותרת</label>
        <input id="title" type="text" maxlength="100" placeholder="לדוגמה: ספה תלת מושבית">
      </div>
      <div class="form-group">
        <label for="description">תיאור</label>
        <textarea id="description" rows="4" maxlength="2000" placeholder="מצב הפריט, מידות, כל פרט שיעזור..."></textarea>
      </div>
      <div class="form-group">
        <label>קטגוריה</label>
        <div class="room-tabs" id="category-tabs"></div>
      </div>
      <div class="form-group">
        <label>מצב הפריט (לא חובה)</label>
        <div class="room-tabs" id="condition-tabs"></div>
      </div>
      <div id="guiding-questions"></div>
    </div>

    <div class="ai-chat-card">
      <h3>💬 צריך עזרה בכתיבת המודעה?</h3>
      <p>שאלו איך לכתוב כותרת טובה, לתאר מצב, ועוד.</p>
      <div class="ai-chat-thread" id="listing-chat-thread"></div>
      <div class="ai-chat-input-row">
        <input type="text" id="listing-chat-input" placeholder="שאלו כאן...">
        <button class="btn btn-primary" id="listing-chat-send-btn">שלח</button>
      </div>
    </div>

    <div class="app-card">
      <h2>איסוף</h2>
      <div class="form-group">
        <label for="city">עיר</label>
        <input id="city" type="text" placeholder="תל אביב">
      </div>
      <div class="form-group">
        <label for="from-address">כתובת מלאה</label>
        <input id="from-address" type="text" placeholder="רחוב ומספר">
      </div>
    </div>

    <div id="submit-error"></div>
    <button class="btn btn-primary btn-block" id="submit-btn">פרסם מודעה</button>
  </div>

  <script type="module">
    import { requireAuth } from './auth.js';
    import { createListing, CATEGORY_INFO } from './listings.js';
    import { uploadListingPhoto } from './storage.js';
    import { resizeImageToBlob, resizeImageToBase64 } from './image-resize.js';
    import { analyzeListingPhoto, askListingAI, isAIConfigured, friendlyAIError } from './ai-vision.js';

    const authState = await requireAuth();
    const MAX_PHOTOS = 10;
    let photos = []; // File objects
    let category = 'furniture';
    let condition = null;
    let guidingQuestions = [];

    const CONDITION_OPTIONS = [
      { key: 'new', label: 'חדש / כמו חדש' },
      { key: 'good', label: 'מצב טוב' },
      { key: 'fair', label: 'מצב סביר' },
    ];

    const tabsEl = document.getElementById('category-tabs');
    Object.entries(CATEGORY_INFO).forEach(([key, info]) => {
      const chip = document.createElement('div');
      chip.className = 'room-tab' + (key === category ? ' active' : '');
      chip.textContent = `${info.icon} ${info.label}`;
      chip.dataset.cat = key;
      chip.addEventListener('click', () => {
        category = key;
        [...tabsEl.children].forEach(c => c.classList.toggle('active', c.dataset.cat === key));
      });
      tabsEl.appendChild(chip);
    });

    const conditionTabsEl = document.getElementById('condition-tabs');
    CONDITION_OPTIONS.forEach(opt => {
      const chip = document.createElement('div');
      chip.className = 'room-tab';
      chip.textContent = opt.label;
      chip.dataset.cond = opt.key;
      chip.addEventListener('click', () => {
        condition = condition === opt.key ? null : opt.key;
        [...conditionTabsEl.children].forEach(c => c.classList.toggle('active', c.dataset.cond === condition));
      });
      conditionTabsEl.appendChild(chip);
    });

    const photoGrid = document.getElementById('photo-grid');
    const photoInput = document.getElementById('photo-input');
    photoInput.addEventListener('change', () => {
      const files = Array.from(photoInput.files || []).slice(0, MAX_PHOTOS - photos.length);
      photos.push(...files);
      photoInput.value = '';
      renderPhotos();
    });
    function renderPhotos() {
      photoGrid.querySelectorAll('.photo-thumb').forEach(el => el.remove());
      photos.forEach((file, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        thumb.innerHTML = `<img src="${URL.createObjectURL(file)}"><button class="photo-remove" data-i="${i}">✕</button>`;
        thumb.querySelector('.photo-remove').addEventListener('click', () => { photos.splice(i, 1); renderPhotos(); });
        photoGrid.insertBefore(thumb, photoGrid.querySelector('.photo-add'));
      });
      photoGrid.querySelector('.photo-add').style.display = photos.length >= MAX_PHOTOS ? 'none' : 'flex';
      document.getElementById('ai-analyze-listing-btn').disabled = photos.length === 0 || !isAIConfigured();
    }

    // ---------- AI photo analysis ----------
    function mapAICondition(key) {
      if (key === 'like_new') return 'new';
      return CONDITION_OPTIONS.some(o => o.key === key) ? key : null;
    }

    function renderGuidingQuestions() {
      const box = document.getElementById('guiding-questions');
      if (guidingQuestions.length === 0) { box.innerHTML = ''; return; }
      box.innerHTML = `<div class="question-card"><div class="question-text">עוד כמה פרטים שיעזרו לשכנים</div>` +
        guidingQuestions.map((q, i) => `
          <div class="form-group" style="margin-top:10px;">
            <label>${q}</label>
            <input type="text" class="guiding-answer-input" data-i="${i}" placeholder="התשובה שלך...">
          </div>
        `).join('') + `</div>`;
    }

    document.getElementById('ai-analyze-listing-btn').addEventListener('click', async () => {
      if (photos.length === 0) return;
      const btn = document.getElementById('ai-analyze-listing-btn');
      const errBox = document.getElementById('ai-listing-error');
      const progressWrap = document.getElementById('ai-listing-progress-wrap');
      const progressFill = document.getElementById('ai-listing-progress-fill');
      errBox.innerHTML = '';
      btn.disabled = true; btn.textContent = 'מנתח...';
      progressWrap.style.display = 'block';
      let progress = 2; progressFill.style.width = '2%';
      const tick = setInterval(() => { progress += (96 - progress) * 0.08; progressFill.style.width = progress + '%'; }, 200);
      try {
        const images = [];
        for (const file of photos) images.push({ base64: await resizeImageToBase64(file), mimeType: 'image/jpeg' });
        const result = await analyzeListingPhoto(images);
        if (result.title) document.getElementById('title').value = result.title;
        if (result.description) document.getElementById('description').value = result.description;
        if (result.category) {
          category = result.category;
          [...tabsEl.children].forEach(c => c.classList.toggle('active', c.dataset.cat === category));
        }
        const mappedCond = mapAICondition(result.condition);
        if (mappedCond) {
          condition = mappedCond;
          [...conditionTabsEl.children].forEach(c => c.classList.toggle('active', c.dataset.cond === condition));
        }
        guidingQuestions = result.guidingQuestions || [];
        renderGuidingQuestions();
        document.getElementById('ai-filled-badge').style.display = result.title ? 'block' : 'none';
      } catch (err) {
        errBox.innerHTML = `<div class="alert alert-error">${friendlyAIError(err)}</div>`;
      } finally {
        clearInterval(tick);
        progressFill.style.width = '100%';
        setTimeout(() => { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }, 400);
        btn.disabled = photos.length === 0 || !isAIConfigured(); btn.textContent = 'נתח תמונות עם AI ✨';
      }
    });

    // ---------- AI chat helper (listing-writing tips) ----------
    let listingChatHistory = [];
    let listingChatThinking = false;

    function renderListingChat() {
      const box = document.getElementById('listing-chat-thread');
      box.innerHTML = listingChatHistory.map(m => `<div class="ai-chat-msg ${m.role === 'user' ? 'user' : 'ai'}">${m.text}</div>`).join('')
        + (listingChatThinking ? '<div class="ai-chat-msg ai typing">חושב...</div>' : '');
      box.scrollTop = box.scrollHeight;
    }

    async function sendListingChat() {
      const input = document.getElementById('listing-chat-input');
      const sendBtn = document.getElementById('listing-chat-send-btn');
      const question = input.value.trim();
      if (!question) return;
      listingChatHistory.push({ role: 'user', text: question });
      input.value = '';
      listingChatThinking = true;
      input.disabled = true; sendBtn.disabled = true;
      renderListingChat();
      try {
        const context = document.getElementById('title').value.trim();
        const reply = await askListingAI(question, context);
        listingChatHistory.push({ role: 'assistant', text: reply });
      } catch (err) {
        listingChatHistory.push({ role: 'assistant', text: friendlyAIError(err) });
      } finally {
        listingChatThinking = false;
        renderListingChat();
        input.disabled = false; sendBtn.disabled = false; input.focus();
      }
    }
    document.getElementById('listing-chat-send-btn').addEventListener('click', sendListingChat);
    document.getElementById('listing-chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendListingChat(); });

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const errBox = document.getElementById('submit-error');
      errBox.innerHTML = '';
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const city = document.getElementById('city').value.trim();
      const fromAddress = document.getElementById('from-address').value.trim();
      if (!title) { errBox.innerHTML = '<div class="alert alert-error">יש להוסיף כותרת.</div>'; return; }
      if (photos.length === 0) { errBox.innerHTML = '<div class="alert alert-error">יש להוסיף לפחות תמונה אחת.</div>'; return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'מכין תמונות...';
      try {
        const photoUrls = [];
        for (let i = 0; i < photos.length; i++) {
          // Resized client-side first — an unmodified smartphone photo can easily
          // exceed storage.rules' 10MB-per-photo cap and would fail to upload.
          const resized = await resizeImageToBlob(photos[i]);
          btn.textContent = `מעלה תמונות... (${i + 1}/${photos.length})`;
          photoUrls.push(await uploadListingPhoto(authState.authUser.uid, resized, i));
        }
        btn.textContent = 'מפרסם מודעה...';
        const answeredQuestions = guidingQuestions
          .map((q, i) => ({ q, a: document.querySelector(`.guiding-answer-input[data-i="${i}"]`)?.value.trim() }))
          .filter(qa => qa.a);
        const questionsText = answeredQuestions.length ? `\n\n${answeredQuestions.map(qa => `${qa.q} ${qa.a}`).join('\n')}` : '';
        const conditionLabel = CONDITION_OPTIONS.find(c => c.key === condition)?.label;
        const fullDescription = `${description}${questionsText}${conditionLabel ? `\n\nמצב: ${conditionLabel}` : ''}`;
        const listingId = await createListing({
          userId: authState.authUser.uid,
          userName: authState.profile.name || '',
          userPhone: authState.profile.phone || '',
          title, description: fullDescription, price: 0, category, city, fromAddress,
          photos: photoUrls,
        });
        location.href = 'marketplace.html';
      } catch (err) {
        errBox.innerHTML = '<div class="alert alert-error">פרסום המודעה נכשל. נסה שוב.</div>';
        btn.disabled = false; btn.textContent = 'פרסם מודעה';
      }
    });
  </script>
</body>
</html>
