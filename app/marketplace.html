<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROZIC MOVE — יד שנייה חינם</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style-app.css">
  <style>
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .listing-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; text-align: right; box-shadow: var(--shadow-1); transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease); }
    .listing-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-3-green); border-color: rgba(14,92,67,0.3); }
    .listing-photo { width: 100%; aspect-ratio: 1; background: linear-gradient(155deg, var(--bg) 0%, var(--green-light) 140%); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; object-fit: cover; }
    .listing-info { padding: 10px 12px; }
    .listing-title { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .listing-city { font-size: 0.74rem; color: var(--text-muted); }
    .listing-free-badge { display: inline-block; margin-top: 4px; font-size: 0.7rem; font-weight: 800; color: var(--green-dark); background: var(--green-light); padding: 2px 8px; border-radius: 50px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: var(--white); border-radius: 22px; box-shadow: var(--shadow-3); max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 26px; position: relative; animation: fadeUp 0.3s var(--ease) both; }
    .modal-close { position: absolute; top: 14px; left: 14px; background: var(--bg); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
    .modal-photos { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
    .modal-photos img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    /* דיסקליימר — יושב בין פרטי המודעה לכפתור יצירת הקשר, כלומר בשורה
       האחרונה שנקראת לפני הפנייה למפרסם. */
    .listing-disclaimer { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 14px 0 12px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.75; }
  </style>
</head>
<body class="app-body">
  <script src="under-construction-banner.js"></script>
  <div class="step-hero">
    <div class="step-hero-inner">
      <a href="index.html" class="btn-text" style="padding:0; margin-bottom:10px; display:inline-block;">→ בחירת שירות</a>
      <h1>יד שנייה חינם</h1>
      <p>תנו פריטים שאינכם צריכים, וקבלו בחינם ממי שגר קרוב.</p>
    </div>
  </div>

  <div class="app-container wide">
    <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
      <a href="marketplace-create.html" class="btn btn-primary">＋ פרסם מודעה</a>
    </div>

    <div class="form-group">
      <input type="text" id="search-input" placeholder="חיפוש לפי שם או עיר..." aria-label="חיפוש מודעות לפי שם או עיר">
    </div>
    <div class="room-tabs" id="category-tabs"></div>

    <div id="loading" class="center-loading"><span class="spinner"></span></div>
    <div class="listing-grid" id="listing-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <div class="empty-icon">🎁</div>
      <div>אין עדיין מודעות בקטגוריה הזו</div>
    </div>

    <div class="app-card" id="my-listings-card" style="display:none; margin-top:32px;">
      <h2>המודעות שלי</h2>
      <div id="my-listings-list" class="order-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="סגירה">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner container">
      <div class="footer-brand">
        <div class="footer-logo">ROZIC MOVE</div>
        <p class="footer-tagline">מזיזים אותך קדימה</p>
        <p class="footer-copy">ROZIC MOVE © 2026</p>
      </div>
      <div class="footer-links">
        <div class="footer-col">
          <div class="footer-col-title">משפטי</div>
          <a href="/privacy.html">מדיניות פרטיות</a>
          <a href="/terms.html">תנאי שימוש</a>
          <a href="/accessibility.html">הצהרת נגישות</a>
          <a href="/delete-account.html">מחיקת חשבון</a>
        </div>
      </div>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-bottom container">
      <p>כל הזכויות שמורות · מדינת ישראל</p>
    </div>
  </footer>

  <script type="module">
    import { requireAuth } from './auth.js';
    import { subscribeToActiveListings, subscribeToUserListings, markListingSold, deleteListing, getListingContact, CATEGORY_INFO } from './listings.js';

    const authState = await requireAuth();

    /**
     * ⚠️ כותרת, תיאור, עיר, שם ותמונות של מודעה הם טקסט חופשי ש**משתמש
     * אחר** הקליד, והם נשתלים כאן לתוך `innerHTML`. בלי בריחה, מודעה עם
     * `<img src=x onerror=...>` בכותרת מריצה קוד אצל **כל** מי שפותח את
     * הלוח — על המקור של rozicmove.com, עם ההתחברות שלו ב-IndexedDB.
     *
     * `listing.html` כבר עשה את זה נכון (`textContent` ו-`img.src` כמאפיין,
     * ראו ההערה שם) — הדף הזה פשוט לא עודכן יחד איתו.
     *
     * הבריחה כוללת `"` ו-`'` כי חלק מהערכים יושבים בתוך מאפיין (`src=`,
     * `alt=`, `href=`), ושם גרשיים סוגרים את המאפיין ופותחים מאפיין חדש —
     * `onerror` למשל — בלי שום תו `<`.
     */
    const esc = (v) => String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    let allListings = [];
    let activeCategory = 'all';
    let searchQuery = '';

    const tabsEl = document.getElementById('category-tabs');
    const categories = ['all', ...Object.keys(CATEGORY_INFO)];
    categories.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'room-tab' + (cat === 'all' ? ' active' : '');
      chip.textContent = cat === 'all' ? '🎁 הכל' : `${CATEGORY_INFO[cat].icon} ${CATEGORY_INFO[cat].label}`;
      chip.dataset.cat = cat;
      chip.addEventListener('click', () => {
        activeCategory = cat;
        [...tabsEl.children].forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
        renderGrid();
      });
      tabsEl.appendChild(chip);
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderGrid();
    });

    subscribeToActiveListings((listings) => {
      allListings = listings;
      document.getElementById('loading').style.display = 'none';
      renderGrid();
    });

    function renderGrid() {
      let filtered = allListings;
      if (activeCategory !== 'all') filtered = filtered.filter(l => l.category === activeCategory);
      if (searchQuery) filtered = filtered.filter(l => l.title?.toLowerCase().includes(searchQuery) || l.city?.toLowerCase().includes(searchQuery));

      const grid = document.getElementById('listing-grid');
      document.getElementById('empty-state').style.display = filtered.length === 0 ? 'block' : 'none';
      grid.innerHTML = filtered.map(l => `
        <div class="listing-card" data-id="${esc(l.id)}">
          ${l.photos?.[0] ? `<img class="listing-photo" src="${esc(l.photos[0])}" alt="${esc(l.title)}">` : `<div class="listing-photo">${CATEGORY_INFO[l.category]?.icon || '📦'}</div>`}
          <div class="listing-info">
            <div class="listing-title">${esc(l.title)}</div>
            <div class="listing-city">${esc(l.city || '')}</div>
            <span class="listing-free-badge">חינם</span>
          </div>
        </div>
      `).join('');
      grid.querySelectorAll('.listing-card').forEach(card => {
        card.addEventListener('click', () => openModal(filtered.find(l => l.id === card.dataset.id)));
      });
    }

    // הטלפון וכתובת האיסוף כבר לא יושבים על מסמך המודעה אלא בתת-מסמך
    // listings/{id}/private/contact (ראו getListingContact) — כלומר הם נטענים
    // בקריאה נפרדת אחרי פתיחת החלון, ולא מגיעים עם ה-snapshot של הרשימה.
    // הטוקן מונע מקריאה איטית של מודעה אחת לדרוס את החלון של מודעה אחרת
    // שהמשתמש כבר פתח בינתיים.
    let modalToken = 0;

    async function openModal(listing) {
      const overlay = document.getElementById('modal-overlay');
      const isOwner = listing.userId === authState.authUser.uid;
      const token = ++modalToken;
      document.getElementById('modal-content').innerHTML = `
        ${listing.photos?.length ? `<div class="modal-photos">${listing.photos.map((p, i) => `<img src="${esc(p)}" alt="${esc(listing.title)} — תמונה ${i + 1}">`).join('')}</div>` : ''}
        <h2>${esc(listing.title)}</h2>
        <p class="app-card-desc">${esc(listing.description || '')}</p>
        <div class="price-line"><span>קטגוריה</span><span>${CATEGORY_INFO[listing.category]?.label || 'שונות'}</span></div>
        <div class="price-line"><span>עיר</span><span>${esc(listing.city || '')}</span></div>
        <div class="price-line"><span>כתובת איסוף</span><span id="modal-address">…</span></div>
        ${(!isOwner && listing.status !== 'sold') ? `<div class="listing-disclaimer">ROZIC MOVE מפרסמת את המודעה בלבד ואינה צד לעסקה. איננו בודקים את הפריט, את מצבו, את בטיחותו או את זהות הצדדים. התיאום, המסירה וההובלה באחריות הצדדים בלבד. מומלץ להיפגש במקום ציבורי ולבדוק את הפריט לפני נטילתו.</div>` : ''}
        <div id="modal-contact">
          ${listing.status === 'sold' ? '<div class="alert alert-info">כבר נמסר</div>' :
            isOwner ? '<div class="alert alert-info">זו המודעה שלך</div>' :
            '<button class="btn btn-primary btn-block" disabled>טוען פרטי קשר…</button>'}
        </div>
      `;
      overlay.style.display = 'flex';

      const contact = await getListingContact(listing.id).catch(() => null);
      if (token !== modalToken) return;
      // ה-fallback לשדות שעל המודעה עצמה הוא עבור מודעות שנוצרו לפני מעבר
      // פרטי הקשר ועדיין נושאות אותם — אותו fallback בדיוק כמו
      // ListingDetailsScreen באפליקציה.
      const address = contact?.fromAddress ?? listing.fromAddress ?? '';
      const phone   = contact?.userPhone   ?? listing.userPhone   ?? '';
      const addressEl = document.getElementById('modal-address');
      if (addressEl) addressEl.textContent = address || '—';

      const contactBox = document.getElementById('modal-contact');
      if (!contactBox || listing.status === 'sold' || isOwner) return;
      if (!phone) {
        contactBox.innerHTML = '<div class="alert alert-info">למודעה הזו לא נשמר טלפון ליצירת קשר.</div>';
        return;
      }
      // `replace(/\D/g,'')` לפני הסרת ה-0 המובילה — בדיוק כמו ב-listing.html.
      // הטלפון נשמר כפי שהמשתמש הקליד אותו בהרשמה (ה-placeholder שם הוא
      // "050-1234567", עם מקפים), ובלי הניקוי הזה נבנתה כתובת שבורה:
      // "050-881-1085" הפך ל-https://wa.me/97250-881-1085.
      const whatsapp = `https://wa.me/972${phone.replace(/\D/g, '').replace(/^0/, '')}?text=${encodeURIComponent(`היי ${listing.userName}, ראיתי את "${listing.title}" ב-ROZIC MOVE ואשמח לקחת אותו. האם עדיין זמין?`)}`;
      contactBox.innerHTML = `<a class="btn btn-primary btn-block" href="${esc(whatsapp)}" target="_blank">💬 יצירת קשר בוואטסאפ</a>`;
    }
    document.getElementById('modal-close').addEventListener('click', () => { document.getElementById('modal-overlay').style.display = 'none'; });
    document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') e.currentTarget.style.display = 'none'; });

    // My listings management
    subscribeToUserListings(authState.authUser.uid, (listings) => {
      const card = document.getElementById('my-listings-card');
      const list = document.getElementById('my-listings-list');
      if (listings.length === 0) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      list.innerHTML = listings.map(l => `
        <div class="order-row-card" style="cursor:default;">
          <div>
            <div class="order-row-title">${esc(l.title)}</div>
            <div class="order-row-meta">${l.status === 'sold' ? 'נמסר' : 'פעיל'}</div>
          </div>
          <div style="display:flex; gap:8px;">
            ${l.status !== 'sold' ? `<button class="btn-text" data-action="sold" data-id="${esc(l.id)}">סמן כנמסר</button>` : ''}
            <button class="btn-text" data-action="delete" data-id="${esc(l.id)}" style="color:#C0392B;">מחק</button>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('[data-action="sold"]').forEach(btn => btn.addEventListener('click', () => markListingSold(btn.dataset.id)));
      list.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', () => { if (confirm('למחוק את המודעה?')) deleteListing(btn.dataset.id); }));
    });
  </script>
</body>
</html>
