  <script type="module">
    import { requireAuth } from './auth.js';
    import { subscribeToOrder } from './orders.js';
    import { getUserProfile } from './users.js';
    import { subscribeToMessages, sendChatMessage, markChatRead } from './chat.js';

    const esc = (v) => String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const authState = await requireAuth();
    const orderId = new URLSearchParams(location.search).get('id');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-box');
    const contentEl = document.getElementById('content');

    function showError(html) {
      loadingEl.style.display = 'none';
      contentEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.innerHTML = html;
    }

    function formatTime(ts) {
      if (!ts || typeof ts.toDate !== 'function') return '';
      return ts.toDate().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    if (!orderId) {
      showError('<div class="empty-icon">❓</div>לא נמצא מזהה הזמנה.');
    } else {
      document.getElementById('hero-back-link').href = `order-status.html?id=${encodeURIComponent(orderId)}`;

      let driverLoaded = false;
      const unsubOrder = subscribeToOrder(orderId, async (order) => {
        if (!order) { showError('<div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.'); return; }
        if (order.customerId !== authState.authUser.uid) { showError('<div class="empty-icon">🚫</div>אין לך הרשאה לצפות בהזמנה זו.'); return; }
        if (!order.driverId) { showError('<div class="empty-icon">💬</div>עדיין אין מוביל משובץ להזמנה — הצ\'אט ייפתח ברגע שמוביל ישובץ.'); return; }

        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
        contentEl.style.display = 'block';

        if (!driverLoaded) {
          driverLoaded = true;
          const driver = await getUserProfile(order.driverId);
          const name = driver?.name || 'המוביל';
          document.getElementById('chat-name').textContent = name;
          document.getElementById('chat-avatar').textContent = name.trim().charAt(0).toUpperCase() || '?';
        }
      }, () => showError('<div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.'));

      const threadEl = document.getElementById('chat-thread');
      const textEl = document.getElementById('chat-text');
      const sendBtn = document.getElementById('chat-send-btn');
      const myUid = authState.authUser.uid;

      subscribeToMessages(orderId, (messages) => {
        if (!messages.length) {
          threadEl.innerHTML = '<div class="chat-empty">שלח הודעה ראשונה</div>';
        } else {
          threadEl.innerHTML = messages.map(m => {
            const mine = m.senderId === myUid;
            return `<div class="chat-msg ${mine ? 'mine' : 'other'}">${esc(m.text)}<span class="chat-msg-time">${esc(formatTime(m.timestamp))}</span></div>`;
          }).join('');
        }
        threadEl.scrollTop = threadEl.scrollHeight;
        markChatRead(orderId);
      });

      function updateSendState() {
        sendBtn.disabled = !textEl.value.trim();
      }
      textEl.addEventListener('input', () => {
        updateSendState();
        textEl.style.height = 'auto';
        textEl.style.height = Math.min(textEl.scrollHeight, 90) + 'px';
      });
      textEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.getElementById('chat-form').requestSubmit();
        }
      });
      updateSendState();

      document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = textEl.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        textEl.disabled = true;
        try {
          await sendChatMessage(orderId, myUid, authState.profile?.name || '', text);
          textEl.value = '';
          textEl.style.height = 'auto';
        } catch (err) {
          // הנוסח של ChatScreen.tsx. ההודעה **נשארת בשדה** (מנוקה רק אחרי
          // הצלחה, בשורה למעלה) — וזה בדיוק מה שהאפליקציה אומרת במפורש,
          // כדי שהמשתמש לא ינסח מחדש הודעה שעדיין כתובה מולו.
          alert('ההודעה לא נשלחה\n\nאין כרגע חיבור לשרת. ההודעה נשארה בשדה — בדוק את חיבור האינטרנט ולחץ שוב על שליחה.');
        } finally {
          textEl.disabled = false;
          updateSendState();
          textEl.focus();
        }
      });
    }
  </script>
