  <script type="module">
    import { requireAuth } from './auth.js';
    import {
      subscribeToOrder, cancelOrder, customerTotalOf, STATUS_LABELS,
      ORDER_PROGRESS_STEPS, customerConfirmCompletion,
    } from './orders.js';
    import { getUserProfile, formatVehicle } from './users.js';

    /**
     * בריחת HTML לכל ערך שמגיע ממסמך ההזמנה. **זו לא הגנה תיאורטית:**
     * חוקי Firestore על `orders` הם denylist — שדה שאינו ברשימה החסומה
     * פתוח לכתיבה, ו-`title`/`notes`/`itemsSummary`/`fromAddress`/
     * `toAddress`/`scheduledDate`/`timeSlot`/`manualPricingItems`/`status`
     * אינם באף אחת מהן. כלומר **המוביל המשובץ** יכול לכתוב אותם על
     * ההזמנה של הלקוח, והדף הזה הוא שמרנדר אותם אצל הלקוח.
     *
     * זהה ל-`esc` ב-marketplace.html. כולל `"` ו-`'` כי חלק מהערכים
     * יושבים בתוך מאפיין (`class=`), ושם גרש סוגר את המאפיין ופותח
     * מאפיין חדש — `onerror` למשל — בלי שום תו `<`.
     */
    const esc = (v) => String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    import { startGrowCheckout } from './payments.js';
    import { isValidFullName, FULL_NAME_ERROR } from './auth.js';

    const authState = await requireAuth();
    const orderId = new URLSearchParams(location.search).get('id');
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');

    if (!orderId) {
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
      contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">❓</div>לא נמצא מזהה הזמנה.</div>';
    } else {
      subscribeToOrder(orderId, (order) => {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        if (!order) {
          contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.</div>';
          return;
        }
        render(order);
      }, (err) => {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.</div>';
      });
    }

    /** מראה FindDriverScreen — מצב "מחפשים מוביל זמין" מיד אחרי התשלום. */
    function renderSearchingCard() {
      return `
        <div class="app-card search-card">
          <div class="search-row">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span class="search-title">מחפשים מוביל זמין...</span>
          </div>
          <div class="search-hint">תקבלו עדכון ברגע שמוביל יאשר.<br>המוביל ייצור איתכם קשר לפני ההגעה.</div>
        </div>`;
    }

    /** מראה OrderProgressBar.tsx — פס 5 שלבים + תווית השלב הנוכחי. */
    function renderProgressBar(stepIndex) {
      const segs = ORDER_PROGRESS_STEPS
        .map((s, i) => `<div class="order-progress-seg ${i <= stepIndex ? 'done' : ''}"></div>`)
        .join('');
      const label = ORDER_PROGRESS_STEPS[stepIndex].label;
      return `
        <div class="order-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${ORDER_PROGRESS_STEPS.length}"
             aria-valuenow="${stepIndex + 1}" aria-label="שלב ${stepIndex + 1} מתוך ${ORDER_PROGRESS_STEPS.length}: ${esc(label)}">
          <div class="order-progress-track">${segs}</div>
          <div class="order-progress-label-row">
            <span class="order-progress-dot" aria-hidden="true"></span>
            <span class="order-progress-label">${esc(label)}</span>
          </div>
        </div>`;
    }

    /** מראה כרטיס המוביל ב-FindDriverScreen (מצב "נמצא") וב-OrderDetailsScreen ("המוביל שלך"). */
    function renderDriverCardInner(driver, order) {
      const heading = order.status === 'assigned' ? 'נמצא לך מוביל!' : 'המוביל שלך';
      const name = driver?.name || 'המוביל שלך';
      const initial = esc((driver?.name || '?').trim().charAt(0).toUpperCase() || '?');
      const vehicle = formatVehicle(driver);
      const verified = driver?.idVerificationStatus === 'verified';
      const phone = driver?.phone;
      return `
        <h2>${esc(heading)}</h2>
        <div class="driver-avatar-row">
          <div class="driver-avatar" aria-hidden="true">${initial}</div>
          <div class="driver-info">
            <div class="driver-name">${esc(name)}${verified ? '<span class="driver-verified">✓ מאומת</span>' : ''}</div>
            ${vehicle ? `<div class="driver-vehicle">${esc(vehicle)}${driver?.vehiclePlate ? ' · ' + esc(driver.vehiclePlate) : ''}</div>` : ''}
          </div>
        </div>
        ${phone
          ? `<a class="call-btn" href="tel:${esc(phone)}">התקשר למוביל — ${esc(phone)}</a>`
          : `<div class="call-btn disabled">${driver ? 'המוביל טרם הוסיף מספר טלפון' : 'טוען פרטי מוביל…'}</div>`}
      `;
    }

    async function loadDriverCard(order) {
      const el = document.getElementById('driver-card');
      if (!el) return;
      const driver = await getUserProfile(order.driverId);
      // המשתמש עשוי לנווט משם/ההזמנה עשויה להתעדכן שוב לפני שהקריאה חוזרת —
      // ה-id עדיין קיים ב-DOM רק אם render() לא רץ מחדש בינתיים.
      const stillThere = document.getElementById('driver-card');
      if (stillThere) stillThere.innerHTML = renderDriverCardInner(driver, order);
    }

    function render(order) {
      const isOwner = order.customerId === authState.authUser.uid;
      if (!isOwner) {
        contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🚫</div>אין לך הרשאה לצפות בהזמנה זו.</div>';
        return;
      }

      // 'pending_pricing' נכלל כאן בדיוק כמו canCancel ב-OrderDetailsScreen
      // באפליקציה — הזמנה שממתינה לתמחור עדיין לא שולמה, ואין שום סיבה
      // לכלוא בה את הלקוח עד שהצוות יתמחר.
      // ⚠️ 16.9 — 'en_route' נוסף: עד היום לקוח שהמוביל שלו כבר בדרך לא ראה
      // כאן שום כפתור ביטול בכלל (מבוי סתום) — אף שהאפליקציה מתירה זאת
      // (ראו getCancellationPolicy ב-cancellation.ts, 22.8) בחיוב 75%. השרת
      // (customerCancelOrder) הוא זה שקובע את דמי הביטול בפועל, ולכן אין כאן
      // צורך בענף חדש — רק בפתיחת הכפתור לסטטוס הזה.
      const cancellable = ['draft', 'pending_pricing', 'pending_payment', 'pending', 'assigned', 'en_route'].includes(order.status);
      const total = customerTotalOf(order);
      const manualItems = order.manualPricingItems ?? [];
      const isActive = order.status === 'assigned' || order.status === 'en_route' || order.status === 'in_progress';
      const stepIndex = ORDER_PROGRESS_STEPS.findIndex(s => s.status === order.status);
      const canRate = order.status === 'completed' && typeof order.driverRating !== 'number';

      contentEl.innerHTML = `
        <div class="app-card">
          <h2>${esc(order.title || 'הזמנה')}</h2>
          <p><span class="status-badge ${esc(order.status)}">${esc(STATUS_LABELS[order.status] || order.status)}</span></p>
          ${stepIndex >= 0 ? renderProgressBar(stepIndex) : ''}
        </div>

        ${order.status === 'pending' ? renderSearchingCard() : ''}

        ${order.driverId && order.status !== 'pending' ? `
        <div class="app-card driver-card" id="driver-card">
          <div class="center-loading"><span class="spinner"></span></div>
        </div>` : ''}

        ${order.status === 'in_progress' && order.driverConfirmedCompletion ? `
        <div class="confirm-completion-card">
          <div class="confirm-completion-title">המוביל דיווח שסיים את ההובלה</div>
          <div class="confirm-completion-sub">אשרו שהיא בוצעה בהצלחה כדי להשלים את התהליך</div>
          <button class="btn btn-primary" id="confirm-completion-btn">אשר סיום הובלה</button>
        </div>` : ''}

        ${isActive ? `
        <div class="quick-actions">
          <a class="btn btn-secondary btn-block quick-action-btn" href="order-chat.html?id=${encodeURIComponent(order.id)}">
            צ'אט עם המוביל
            ${order.unreadCustomer ? `<span class="chat-unread-badge">${order.unreadCustomer > 9 ? '9+' : esc(order.unreadCustomer)}</span>` : ''}
          </a>
          ${order.status === 'en_route' ? `<a class="btn btn-secondary btn-block quick-action-btn" href="order-track.html?id=${encodeURIComponent(order.id)}">מעקב חי</a>` : ''}
        </div>` : ''}

        ${order.status === 'pending_pricing' ? `
        <div class="app-card">
          <div class="alert alert-info">
            ההזמנה נשמרה. הוספת פריט שאין לו מחיר אוטומטי, ולכן עוד אין סכום סופי לחיוב —
            הצוות שלנו יתמחר אותו בקרוב, וברגע שזה יקרה יופיע כאן כפתור תשלום עם הסכום המלא.
            הסכום למטה הוא ביניים ואינו כולל את הפריט שממתין לתמחור.
          </div>
        </div>` : ''}

        ${order.status === 'pending_payment' ? `
        <div class="app-card">
          <div class="alert alert-info">ההזמנה נוצרה — נשאר רק לשלם כדי שמוביל יוכל לקחת אותה.</div>
          <button class="btn btn-primary btn-block" id="pay-btn">שלם עכשיו — ₪${esc(total)}</button>
          <div id="pay-error" role="alert"></div>
        </div>` : ''}

        <div class="app-card">
          <h2>פרטי ההזמנה</h2>
          ${order.fromAddress ? `<div class="price-line"><span>מוצא</span><span>${esc(order.fromAddress)}</span></div>` : ''}
          ${order.toAddress ? `<div class="price-line"><span>יעד</span><span>${esc(order.toAddress)}</span></div>` : ''}
          ${order.scheduledDate ? `<div class="price-line"><span>תאריך</span><span>${esc(order.scheduledDate)}${order.timeSlot ? ' · ' + esc(order.timeSlot) : ''}</span></div>` : ''}
          ${order.itemsSummary ? `<div class="price-line"><span>פריטים</span><span>${esc(order.itemsSummary)}</span></div>` : ''}
          ${order.notes ? `<div class="price-line"><span>הערות</span><span>${esc(order.notes)}</span></div>` : ''}
          ${manualItems.length ? `
          <div class="price-line"><span>פריטים לתמחור ידני</span><span>${
            manualItems.map(mi => `${esc(mi.label)} ×${esc(mi.qty)}${mi.price !== undefined ? ` — ₪${esc(mi.price)}` : ' — ממתין לתמחור'}`).join('<br>')
          }</span></div>` : ''}
          <div class="price-total"><span>${order.status === 'pending_pricing' ? 'סה"כ עד כה' : 'סה"כ'}</span><strong>₪${esc(total)}</strong></div>
          ${order.growInvoiceUrl ? `
          <a class="invoice-link-row" href="${esc(order.growInvoiceUrl)}" target="_blank" rel="noopener">
            📄 ${order.growInvoiceNumber ? `חשבונית מס ${esc(order.growInvoiceNumber)}` : 'צפה בחשבונית'}
          </a>` : ''}
        </div>

        ${canRate ? `
        <div class="app-card rate-link-card">
          <h2>איך היה?</h2>
          <p>ההובלה הושלמה — נשמח לשמוע איך היה.</p>
          <a class="btn btn-primary" href="order-rate.html?id=${encodeURIComponent(order.id)}">דרג את ההובלה</a>
        </div>` : ''}

        ${cancellable ? `
        <button class="btn btn-danger btn-block" id="cancel-btn">ביטול הזמנה</button>
        <div id="cancel-error" role="alert"></div>` : ''}
      `;

      if (order.driverId && order.status !== 'pending') {
        loadDriverCard(order);
      }

      document.getElementById('confirm-completion-btn')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true; btn.textContent = 'מאשר...';
        try {
          await customerConfirmCompletion(order.id);
          // ההזמנה תתעדכן מיד דרך המנוי החי (subscribeToOrder) ו-render() ירוץ מחדש.
        } catch (err) {
          btn.disabled = false; btn.textContent = 'אשר סיום הובלה';
          alert('לא הצלחנו לעדכן. נסה שוב.');
        }
      });

      document.getElementById('pay-btn')?.addEventListener('click', async (e) => {
        const btn = e.target;
        const payErrBox = document.getElementById('pay-error');
        payErrBox.innerHTML = '';
        /**
         * ⚠️ 16.9 (פאזה 3) — שני השערים שכבר חוסמים ב-`createOrder`
         * (apartment.html/small-move.html), חוזרים כאן בכוונה. הזמנה
         * יכולה להגיע ל-`pending_payment` בלי לעבור את השער הזה באתר —
         * למשל הזמנה ישנה שנוצרה לפני 15.9 (כשהשער עדיין לא היה קיים),
         * או הזמנה שתומחרה ידנית ע"י הצוות מ-`pending_pricing`. זהה
         * ל-`proceedToPayment` ב-`SummaryScreen.tsx`: טלפון מאומת קודם,
         * שם מלא אחר כך — Grow דוחה שם חד-מילי, וללא טלפון מאומת המוביל
         * לא יכול ליצור קשר עם מי ששילם.
         */
        if (!authState.profile.phoneVerified) {
          payErrBox.innerHTML = '<div class="alert alert-error">נדרש אימות טלפון לפני התשלום — המוביל צריך דרך ליצור איתך קשר. <a tabindex="0" href="account.html">לאימות</a></div>';
          return;
        }
        if (!isValidFullName(authState.profile.name)) {
          payErrBox.innerHTML = `<div class="alert alert-error">${FULL_NAME_ERROR} <a tabindex="0" href="edit-profile.html">לעריכת הפרופיל</a></div>`;
          return;
        }
        btn.disabled = true; btn.textContent = 'מעביר לתשלום...';
        try {
          await startGrowCheckout(order.id);
        } catch (err) {
          payErrBox.innerHTML = '<div class="alert alert-error">פתיחת התשלום נכשלה. נסה שוב.</div>';
          btn.disabled = false; btn.textContent = `שלם עכשיו — ₪${total}`;
        }
      });

      /**
       * ⚠️ 15.9 — **הלקוח לא ידע שייגבו ממנו דמי ביטול.**
       *
       * `confirm('לבטל את ההזמנה?')` לא הזכיר אותם במילה, והתוצאה לא
       * הוצגה אחר כך. כלומר לקוח שביטל הזמנה משולמת יום לפני המועד
       * חויב 50% **וגילה את זה מדף החשבון**. באפליקציה מוצגת טבלת
       * המדרג לפני האישור.
       *
       * ⚠️ **התיקון אינו לחשב את המדרג כאן** — זה בדיוק מה שהועבר
       * לשרת. הפונקציה מחזירה את מה שנגבה בפועל ואת חוב ההחזר, והם
       * מוצגים מיד. האזהרה שלפני האישור מנוסחת כללית ("ייתכן חיוב
       * לפי מדיניות הביטול") ולא כמספר, כי מספר שיוצג כאן יהיה חישוב
       * שני שיכול להיפרד מהשרת.
       *
       * 16.9 — הכפתור נשאר פתוח גם ב-'en_route' (ראו `cancellable`
       * למעלה): אותה הודעה כללית עדיין נכונה — "ייתכן חיוב" מכסה גם
       * את השיעור הקבוע (75%) של השלב הזה, לא רק את מדרג הזמן.
       */
      document.getElementById('cancel-btn')?.addEventListener('click', async (e) => {
        if (!confirm('לבטל את ההזמנה?\n\nלפי מדיניות הביטול ייתכן חיוב דמי ביטול, בהתאם לשלב שבו נמצאת ההזמנה ולזמן שנותר עד מועד ההובלה.')) return;
        const btn = e.currentTarget;
        const box = document.getElementById('cancel-error');
        btn.disabled = true; btn.textContent = 'מבטל…';
        try {
          const { fee, refundDue } = await cancelOrder(order.id);
          const parts = ['ההזמנה בוטלה.'];
          if (fee > 0) parts.push(`נגבו דמי ביטול בסך ₪${fee}.`);
          if (refundDue > 0) parts.push(`יוחזרו לך ₪${refundDue} — ההחזר מבוצע ידנית ע"י הצוות.`);
          box.innerHTML = `<div class="alert alert-success" role="status">${parts.join(' ')}</div>`;
        } catch (err) {
          // ⚠️ הודעה שאומרת מה הצעד הבא. "נכשל" לבדו משאיר את הלקוח
          // בלי לדעת אם ההזמנה עדיין פעילה.
          box.innerHTML = '<div class="alert alert-error" role="alert">לא הצלחנו לבטל את ההזמנה. ההזמנה עדיין פעילה — אפשר לנסות שוב, או לפנות לתמיכה.</div>';
          btn.disabled = false; btn.textContent = 'ביטול הזמנה';
        }
      });
    }
  </script>
</body>
</html>
