<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROZIC MOVE — מעקב בזמן אמת</title>
  <meta name="robots" content="noindex, follow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ROZIC MOVE">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="מעקב בזמן אמת — ROZIC MOVE">
  <meta property="og:description" content="מעקב אחרי מיקום המוביל בזמן אמת ב-ROZIC MOVE.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=93d67ba9">
  <link rel="stylesheet" href="style-app.css?v=d27add7a">
  <!-- מפה — Leaflet + OpenStreetMap (בלי מפתח API), מראה TrackOrderScreen.tsx.
       script קלאסי (לא module) כדי שהמשתנה הגלובלי L יהיה מוכן לפני ה-module שלמטה. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="app-body">
<div data-build-stamp class="build-stamp" aria-hidden="true">עודכן 16.09 · 23:02</div>
  <a class="skip-link" href="#main-content">דלג לתוכן המרכזי</a>
  <script type="module" src="pilot-banner.js?v=14a0e537"></script>
  <main id="main-content" tabindex="-1">

  <div class="step-hero">
    <div class="step-hero-inner">
      <a href="order-status.html" id="hero-back-link" class="btn-text" style="padding:0; margin-bottom:10px; display:inline-block;">→ פרטי ההזמנה</a>
      <h1>מעקב בזמן אמת</h1>
      <p>המיקום של המוביל שלכם, מתעדכן חי.</p>
    </div>
  </div>

  <div class="app-container">
    <div id="loading" class="center-loading"><span class="spinner"></span></div>
    <div id="error-box" class="empty-state" style="display:none;"></div>
    <div id="content" style="display:none;">
      <div class="app-card">
        <div id="map" class="track-map" role="img" aria-label="מפה עם מיקום המוביל, כתובת המוצא וכתובת היעד"></div>
        <div id="track-panel"></div>
        <div class="track-legend">
          <span><span class="dot from" aria-hidden="true"></span> מוצא</span>
          <span><span class="dot to" aria-hidden="true"></span> יעד</span>
          <span><span class="dot driver" aria-hidden="true"></span> המוביל</span>
        </div>
      </div>
      <a class="btn btn-secondary btn-block" id="back-link" href="order-status.html">→ חזרה לפרטי ההזמנה</a>
    </div>
  </div>

  </main>

  <footer class="footer">
    <div class="footer-inner container">
      <div class="footer-brand">
        <div class="footer-logo">ROZIC MOVE</div>
        <p class="footer-tagline">מזיזים אותך קדימה</p>
        <p class="footer-copy">ROZIC MOVE © 2026</p>
      </div>
      <div class="footer-links">
        <div class="footer-col">
          <div class="footer-col-title">משפטי</div>
          <a href="/privacy.html">מדיניות פרטיות</a>
          <a href="/terms.html">תנאי שימוש</a>
          <a href="/accessibility.html">הצהרת נגישות</a>
          <a href="/delete-account.html">מחיקת חשבון</a>
        </div>
      </div>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-bottom container">
      <p>כל הזכויות שמורות · מדינת ישראל</p>
    </div>
  </footer>

  <script type="module">
    import { requireAuth } from './auth.js';
    import { subscribeToOrder, subscribeToDriverLocation, locationFreshness, formatLocationAge } from './orders.js';

    const esc = (v) => String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const authState = await requireAuth();
    const orderId = new URLSearchParams(location.search).get('id');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-box');
    const contentEl = document.getElementById('content');

    function showError(html) {
      loadingEl.style.display = 'none';
      contentEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.innerHTML = html;
    }

    if (!orderId) {
      showError('<div class="empty-icon">❓</div>לא נמצא מזהה הזמנה.');
    } else {
      document.getElementById('hero-back-link').href = `order-status.html?id=${encodeURIComponent(orderId)}`;
      document.getElementById('back-link').href = `order-status.html?id=${encodeURIComponent(orderId)}`;

      let map = null, fromMarker = null, toMarker = null, driverMarker = null;
      let latestLoc = null;

      // צבעי הסמנים מראים בכוונה את הטוקנים ב-style.css (--green #0E5C43,
      // --danger #C0392B, --navy #1D3557) — כאן כערכים גולמיים כי אלה
      // מחרוזות HTML שנבנות ב-JS, לא CSS מקושר, ולכן var() לא זמין להן.
      function markerIcon(glyph, bg) {
        return L.divIcon({
          className: '',
          html: `<div style="width:28px;height:28px;border-radius:50%;background:${bg};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;">${glyph}</div>`,
          iconSize: [28, 28], iconAnchor: [14, 14],
        });
      }

      function ensureMap() {
        if (map) return;
        map = L.map('map').setView([32.0853, 34.7818], 12); // מראה defaultRegion (מרכז ת"א) ב-TrackOrderScreen
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);
        // ⚠️ המפה נוצרת באותה טיק שבו #content עובר מ-display:none ל-block
        // (contentEl.style.display='block' למעלה) — Leaflet מודד את גודל
        // המכל **ברגע היצירה**, ולפעמים תופס אותו כ-0×0 לפני שהדפדפן סיים
        // לחשב את הפריסה מחדש. בלי invalidateSize() הפאנינג/הזום הבאים
        // (fitBounds/panTo) מחושבים לפי גודל שגוי, והמפה נראית "קפואה" גם
        // כשסמנים כבר נוספים אליה בפועל.
        setTimeout(() => map.invalidateSize(), 0);
      }

      function updatePanel() {
        const panelEl = document.getElementById('track-panel');
        if (!panelEl) return;
        const freshness = locationFreshness(latestLoc);
        if (!freshness) {
          panelEl.innerHTML = '<div class="track-panel"><span class="track-dot"></span><span class="track-text">ממתינים שהמוביל ישתף מיקום...</span></div>';
        } else if (freshness === 'live') {
          panelEl.innerHTML = '<div class="track-panel"><span class="track-dot"></span><span class="track-text">המוביל משתף מיקום בזמן אמת</span></div>';
        } else if (freshness === 'stale') {
          panelEl.innerHTML = `<div class="track-panel stale"><span class="track-dot"></span><span class="track-text">המיקום לא מתעדכן כרגע — ייתכן שהמוביל באפליקציית ניווט. עודכן ${esc(formatLocationAge(latestLoc))}.</span></div>`;
        } else {
          panelEl.innerHTML = `<div class="track-panel lost"><span class="track-dot"></span><span class="track-text">המעקב מושהה. הנקודה על המפה היא המיקום האחרון שהתקבל, ${esc(formatLocationAge(latestLoc))} — ולא המיקום הנוכחי של המוביל.</span></div>`;
        }
      }
      // המיקום מתיישן בלי שמגיע snapshot חדש — טיק עצמאי, מראה nowTick ב-TrackOrderScreen.
      setInterval(updatePanel, 10_000);

      let sawOrderOnce = false;
      subscribeToOrder(orderId, (order) => {
        if (!order) { showError('<div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.'); return; }
        if (order.customerId !== authState.authUser.uid) { showError('<div class="empty-icon">🚫</div>אין לך הרשאה לצפות בהזמנה זו.'); return; }

        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
        contentEl.style.display = 'block';
        ensureMap();

        // ממקדים על כתובות המוצא/היעד רק לפני שיש נקודת מוביל בכלל —
        // ברגע שהמוביל משתף מיקום, המנוי השני (למטה) תופס פיקוד. מראה
        // ה-effect המקביל ב-TrackOrderScreen.
        if (!driverMarker) {
          const pts = [];
          if (order.fromLat != null && order.fromLng != null) pts.push([order.fromLat, order.fromLng]);
          if (order.toLat != null && order.toLng != null) pts.push([order.toLat, order.toLng]);
          // animate:false בכוונה: קריאה סמוכה נוספת (panTo במנוי המיקום
          // למטה, כשמגיע מיקום מוביל) תוך כדי אנימציית זום/פאן עוד פעילה
          // בלבלה את חישוב הפיקסלים של Leaflet — נמדד: סמן המוביל נחת
          // מאות פיקסלים מחוץ לתצוגה. תזוזה מיידית סוגרת את המרוץ.
          if (pts.length === 1) map.setView(pts[0], 14, { animate: false });
          else if (pts.length === 2) map.fitBounds(pts, { padding: [50, 50], animate: false });
        }

        if (fromMarker) { map.removeLayer(fromMarker); fromMarker = null; }
        if (order.fromLat != null && order.fromLng != null) {
          fromMarker = L.marker([order.fromLat, order.fromLng], { icon: markerIcon('A', '#0E5C43'), title: 'מוצא' }).addTo(map);
          if (order.fromAddress) fromMarker.bindPopup(esc(order.fromAddress));
        }
        if (toMarker) { map.removeLayer(toMarker); toMarker = null; }
        if (order.toLat != null && order.toLng != null) {
          toMarker = L.marker([order.toLat, order.toLng], { icon: markerIcon('B', '#C0392B'), title: 'יעד' }).addTo(map);
          if (order.toAddress) toMarker.bindPopup(esc(order.toAddress));
        }

        if (!sawOrderOnce && !order.fromLat && !order.toLat && !latestLoc) {
          // בלי אף קואורדינטה (הזמנה ישנה/גיאוקודינג שנכשל) — אין מה למקד
          // עליו, אבל המפה עצמה עדיין שימושית ברגע שיגיע מיקום מוביל.
        }
        sawOrderOnce = true;
      }, () => showError('<div class="empty-icon">🚫</div>ההזמנה לא נמצאה, או שאין לך הרשאה לצפות בה.'));

      subscribeToDriverLocation(orderId, (loc) => {
        latestLoc = loc;
        updatePanel();
        if (!map || !loc) return;
        if (!driverMarker) {
          driverMarker = L.marker([loc.lat, loc.lng], { icon: markerIcon('🚚', '#1D3557'), title: 'המוביל' }).addTo(map);
        } else {
          driverMarker.setLatLng([loc.lat, loc.lng]);
        }
        map.panTo([loc.lat, loc.lng], { animate: false });
      });

      updatePanel();
    }
  </script>
</body>
</html>
