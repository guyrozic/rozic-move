<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROZIC MOVE — מוצר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(160deg, #C8EDD8 0%, #E0F5E9 50%, #F0FAF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFF;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(14,92,67,0.15);
    }
    .logo { font-size: 42px; margin-bottom: 12px; }
    .brand { font-size: 22px; font-weight: 900; color: #0E5C43; margin-bottom: 6px; }
    .tagline { font-size: 15px; color: #888; margin-bottom: 28px; }
    .divider { height: 1px; background: #E0F0E8; margin: 20px 0; }
    .opening { font-size: 16px; color: #555; line-height: 26px; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Heebo', sans-serif;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #0E5C43; color: #FFF; }
    .btn-apple { background: #000; color: #FFF; }
    .btn-android { background: #1D3557; color: #FFF; }
    .btn:hover { opacity: 0.9; }
    .note { font-size: 12px; color: #AAA; margin-top: 16px; }
    #status { font-size: 14px; color: #0E5C43; font-weight: 600; margin-bottom: 16px; }

    /* פוטר משפטי — הצהרת הנגישות חייבת להיות נגישה מכל דף.
       יושב בתוך הכרטיס, כי ה-body כאן ממורכז ב-flex. */
    .legal-links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #E0F0E8;
      font-size: 12px;
      line-height: 22px;
      color: #BBB;
    }
    .legal-links a { color: #40604F; text-decoration: none; }
    .legal-links a:hover { text-decoration: underline; }

    /* --- Listing --- */
    .listing-photos { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
    .listing-photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
    .listing-title { font-size: 19px; font-weight: 900; color: #1A2E1A; margin-bottom: 4px; }
    .listing-meta { font-size: 13px; color: #888; margin-bottom: 12px; }
    .listing-desc { font-size: 14px; color: #555; line-height: 23px; white-space: pre-wrap; margin-bottom: 16px; }
    .free-badge {
      display: inline-block; font-size: 12px; font-weight: 800;
      color: #0E5C43; background: #E0F5E9; padding: 3px 10px; border-radius: 50px; margin-bottom: 12px;
    }
    .info-box {
      background: #F6FBF8; border: 1px solid #DCEFE5; border-radius: 14px;
      padding: 14px 16px; font-size: 14px; color: #40604F; line-height: 22px; margin-bottom: 12px;
    }
    .contact-row { font-size: 14px; color: #555; margin-bottom: 8px; }
    .contact-row strong { color: #1A2E1A; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚚</div>
    <div class="brand">ROZIC MOVE</div>
    <div class="tagline">מזיזים אותך קדימה</div>

    <div id="status">מנסה לפתוח את האפליקציה...</div>

    <div class="opening" id="opening">
      שותפו איתך מוצר דרך ROZIC MOVE.<br>
      לצפייה במוצר — פתח את האפליקציה.
    </div>

    <div id="listing-body" style="display:none; text-align:right;">
      <div class="listing-photos" id="listing-photos"></div>
      <div class="free-badge">חינם</div>
      <div class="listing-title" id="listing-title"></div>
      <div class="listing-meta" id="listing-meta"></div>
      <div class="listing-desc" id="listing-desc"></div>
      <div id="contact-box"></div>
    </div>

    <div class="divider"></div>

    <button class="btn btn-primary" onclick="openApp()">פתח באפליקציה ←</button>
    <a class="btn btn-apple" href="https://apps.apple.com/app/id6783814838">📱 הורד ל-iPhone</a>
    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.rozicmove.app">🤖 הורד לאנדרואיד</a>

    <div class="note">אין לך את האפליקציה? הורד בחינם ↑</div>

    <footer class="legal-links">
      <a href="/privacy.html">מדיניות פרטיות</a> ·
      <a href="/terms.html">תנאי שימוש</a> ·
      <a href="/accessibility.html">הצהרת נגישות</a> ·
      <a href="/delete-account.html">מחיקת חשבון</a>
    </footer>
  </div>

  <script>
    function getListingId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || '';
    }

    function openApp() {
      const id = getListingId();
      if (id) {
        window.location.href = `rozicmove://listing/${id}`;
      }
    }

    // Auto-try to open app after short delay
    const id = getListingId();
    if (id) {
      setTimeout(() => {
        document.getElementById('status').textContent = '✓ אם האפליקציה לא נפתחה — הורד אותה למטה';
        window.location.href = `rozicmove://listing/${id}`;
      }, 800);
    } else {
      document.getElementById('status').textContent = '';
    }
  </script>

  <script type="module">
    // מי שאין לו את האפליקציה נשאר בדף הזה אחרי ניסיון ה-deep link שלמעלה,
    // ועד היום לא היה לו שום דבר לראות — לא את המודעה ולא דרך ליצור קשר.
    import { auth } from './app/firebase.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { getListing, getListingContact, CATEGORY_INFO } from './app/listings.js';

    const listingId = new URLSearchParams(location.search).get('id') || '';
    if (listingId) {
      const openingEl = document.getElementById('opening');
      const bodyEl    = document.getElementById('listing-body');
      openingEl.textContent = 'טוען את המודעה...';

      const listing = await getListing(listingId).catch(() => null);
      if (!listing) {
        openingEl.textContent = 'המודעה לא נמצאה — ייתכן שהיא הוסרה או שהקישור שגוי.';
      } else {
        openingEl.style.display = 'none';
        bodyEl.style.display = 'block';

        // textContent ולא innerHTML: כותרת/תיאור/עיר הם טקסט חופשי שמשתמש
        // אחר הקליד, והדף הזה נפתח לכל אדם באינטרנט בלי התחברות.
        document.getElementById('listing-title').textContent = listing.title || 'מוצר';
        document.getElementById('listing-meta').textContent =
          [CATEGORY_INFO[listing.category]?.label, listing.city].filter(Boolean).join(' · ');
        document.getElementById('listing-desc').textContent = listing.description || '';

        const photosEl = document.getElementById('listing-photos');
        (listing.photos || []).forEach(url => {
          const img = document.createElement('img');
          img.src = url;              // property ולא תבנית מחרוזת — לא נסגר מ-src מזויף
          img.alt = listing.title || '';
          photosEl.appendChild(img);
        });
        if (!(listing.photos || []).length) photosEl.style.display = 'none';

        renderContact(listing);
      }
    }

    function renderContact(listing) {
      const box = document.getElementById('contact-box');
      if (listing.status === 'sold') {
        box.innerHTML = '<div class="info-box">המוצר כבר נמסר.</div>';
        return;
      }
      box.innerHTML = '<div class="info-box">בודק אם אתה מחובר...</div>';

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          // מכוון (נקבע 21.8): הטלפון והכתובת יושבים בתת-מסמך שדורש התחברות,
          // כדי שלא ייגרפו אנונימית. **גם** למודעה ישנה שעדיין נושאת
          // userPhone על המסמך הציבורי לא מציגים אותו כאן — הצגה כזו הייתה
          // פותחת מחדש בדיוק את הדליפה שנסגרה.
          const next = encodeURIComponent(`../listing.html?id=${listing.id}`);
          box.innerHTML = `
            <div class="info-box">פרטי הקשר של המפרסם מוצגים למשתמשים מחוברים בלבד.</div>
            <a class="btn btn-primary" href="app/login.html?next=${next}">התחבר כדי לראות טלפון ←</a>`;
          return;
        }

        // ה-fallback לשדות שעל המודעה עצמה הוא עבור מודעות שנוצרו לפני מעבר
        // פרטי הקשר — אותו fallback כמו ListingDetailsScreen באפליקציה.
        const contact = await getListingContact(listing.id).catch(() => null);
        const phone   = contact?.userPhone   ?? listing.userPhone   ?? '';
        const address = contact?.fromAddress ?? listing.fromAddress ?? '';

        if (!phone) {
          box.innerHTML = '<div class="info-box">למודעה הזו לא נשמר טלפון ליצירת קשר. אפשר לפנות דרך האפליקציה.</div>';
          return;
        }

        box.textContent = '';
        if (address) {
          const row = document.createElement('div');
          row.className = 'contact-row';
          row.append('כתובת איסוף: ');
          const strong = document.createElement('strong');
          strong.textContent = address;
          row.appendChild(strong);
          box.appendChild(row);
        }
        const row = document.createElement('div');
        row.className = 'contact-row';
        row.append('טלפון: ');
        const strong = document.createElement('strong');
        strong.textContent = phone;
        row.appendChild(strong);
        box.appendChild(row);

        const text = `היי ${listing.userName || ''}, ראיתי את "${listing.title || ''}" ב-ROZIC MOVE ואשמח לקחת אותו. האם עדיין זמין?`;
        const wa = document.createElement('a');
        wa.className = 'btn btn-primary';
        wa.style.marginTop = '12px';
        wa.target = '_blank';
        wa.rel = 'noopener';
        wa.href = `https://wa.me/972${phone.replace(/\D/g, '').replace(/^0/, '')}?text=${encodeURIComponent(text)}`;
        wa.textContent = '💬 יצירת קשר בוואטסאפ';
        box.appendChild(wa);
      });
    }
  </script>
</body>
</html>
