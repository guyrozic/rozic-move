    שהכריזה הצלחה לפני שבדקנו דבר. גוף הדף כבר תוקן, אבל לשונית הדפדפן,
    ההיסטוריה והסימנייה המשיכו לומר "התשלום התקבל" גם במסלול שבו

    הכותרת כאן נייטרלית, ו-`setStatus` מעדכן אותה לפי התוצאה בפועל.
  -->
  <title>ROZIC MOVE — מצב התשלום</title>
  <!--
    ⚠️ 15.9 — הדף היה חסום ב-robots.txt ב-`Disallow` בלבד.
    `Disallow` מונע **זחילה**, לא **אינדוקס**: גוגל עדיין מאנדקס כתובת
    שהגיעה אליו מקישור חיצוני, ומציג אותה בלי תיאור. גרוע מכך — כל עוד
    הזחילה חסומה, גוגל לעולם לא יקרא `noindex` שיתווסף כאן, כי הוא לא
    ייכנס לדף כדי לראות אותו. לכן שורת ה-`Disallow` הוסרה מ-robots.txt
    והחסימה עברה לתגית הזו, שהיא היחידה שבאמת מוציאה מהאינדקס.
    `follow` — הקישורים המשפטיים שבפוטר כן ראויים למעקב.
  -->
  <meta name="robots" content="noindex, follow">

  <!-- Open Graph / Twitter — קישור לדף הזה הוצג עד היום בלי כותרת,
       בלי תיאור ובלי תצוגה מקדימה בכל מקום שמשתפים אותו. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ROZIC MOVE">
  <meta property="og:locale" content="he_IL">
  <meta property="og:url" content="https://rozicmove.com/payment-success.html">

  <!-- 15.9 — תמונת השיתוף. המקור: scripts/og-image.svg, נבנית מחדש ב-node scripts/make-og-image.mjs -->
  <meta property="og:image" content="https://rozicmove.com/og-image.png">

  <meta name="twitter:image" content="https://rozicmove.com/og-image.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(160deg, #C8EDD8 0%, #E0F5E9 50%, #F0FAF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

    }
    .card {
      background: #FFF;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(14,92,67,0.15);
    }
    .logo { font-size: 47px; margin-bottom: 12px; }
    .brand { font-size: 25px; font-weight: 900; color: #0E5C43; margin-bottom: 6px; }
    /* 15.9 — #888 על לבן = 3.54:1, מתחת לסף. #6E6E6E => 5.0:1 */
    .tagline { font-size: 17px; color: #6E6E6E; margin-bottom: 28px; }
    .divider { height: 1px; background: #E0F0E8; margin: 20px 0; }
    .opening { font-size: 18px; color: #555; line-height: 29px; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Heebo', sans-serif;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #0E5C43; color: #FFF; }
    .btn-apple { background: #000; color: #FFF; }
    .btn-android { background: #1D3557; color: #FFF; }
    .btn:hover { opacity: 0.9; }
    /* ⚠️ 15.9 ביקורת נגישות — #AAA על לבן נמדד 2.32:1, הרחק מתחת ל-4.5
       הנדרש לטקסט רגיל. #767676 הוא הגוון הכהה ביותר שעדיין נקרא "אפור
       משני" ועומד בסף (4.54:1). שלושת הדפים האלה מחזיקים CSS משלהם ולא
       נכללו בסבב שעבר על שאר האתר. */
    .note { font-size: 13px; color: #767676; margin-top: 16px; }
    #status { font-size: 16px; color: #0E5C43; font-weight: 600; margin-bottom: 16px; }

    /* פוטר משפטי — הצהרת הנגישות חייבת להיות נגישה מכל דף.
       יושב בתוך הכרטיס, כי ה-body כאן ממורכז ב-flex. */
    /* ⚠️ 15.9 — הגוון היה #BBB, כלומר 1.92:1 על לבן. הוא צובע את המפרידים
       "·" שבין הקישורים — טקסט מרונדר לכל דבר, ולכן כפוף ל-4.5:1 כמו כל
       טקסט אחר. #767676 הוא הגוון הבהיר ביותר שעדיין עובר (4.54:1).
       הקישורים עצמם נושאים #40604F ולא הושפעו. */
    .legal-links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #E0F0E8;
      font-size: 13px;
      line-height: 25px;
      color: #767676;
    }
    /* ⚠️ 15.9 — יעד הנגיעה היה 19px, מתחת ל-24×24 (WCAG 2.2, 2.5.8) —
       וזה כלל את הקישור להצהרת הנגישות עצמה. אותו תיקון בדיוק נעשה
       בפוטר הראשי ב-11.9 ולא הגיע לשלושת הדפים האלה.
       padding אנכי, לא min-height, כדי לא לשנות פריסה. */
    .legal-links a { color: #40604F; text-decoration: none; display: inline-block; padding-block: 4px; }
    .legal-links a:hover { text-decoration: underline; }

    /* --- נגישות מקלדת: טבעת מיקוד נראית --- */
    /* אותה טבעת בדיוק כמו בשאר האתר (`--green` = #0E5C43). הדף הזה מחזיק
       CSS משלו ואינו טוען את style.css, ולכן הכלל נוסף כאן מקומית.
       `outline` בלבד — אינו תופס מקום בפריסה, ולכן שום דבר לא זז. */
    a:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible { outline: 3px solid #0E5C43; outline-offset: 2px; }

    /* ⚠️ 15.9 — "דלג לתוכן המרכזי" (WCAG 2.4.1, רמה A).
       הדף הזה אינו טוען את style.css, ולכן הכלל משוכפל כאן בערכים
       גולמיים שזהים לטוקנים: --green ‏#0E5C43, --white ‏#FFFFFF,
       --radius-sm ‏10px. שינוי באחד מהם חייב לעבור גם כאן.
       לא display:none — זה היה מוציא את הקישור מסדר ה-Tab ומבטל אותו. */
    .skip-link {
      position: fixed;
      top: -120px;
      inset-inline-start: 16px;
      z-index: 10000;
      padding: 12px 22px;
      border-radius: 0 0 10px 10px;
      background: #0E5C43;
      color: #FFFFFF;            /* 7.98:1 על #0E5C43 */
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      text-decoration: none;
      box-shadow: 0 16px 32px rgba(20,42,34,0.18);
      transition: top 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .skip-link:focus { top: 0; }
    .skip-link:focus-visible { outline: 3px solid #FFFFFF; outline-offset: -6px; }
    @media (prefers-reduced-motion: reduce) { .skip-link { transition: none; } }

    /* ⚠️ 16.9 — `.build-stamp` מוגדר רק ב-style.css, שהדף הזה לא טוען.
       בלעדיו ה-div שנוסף אוטומטית ע"י stamp-assets.mjs נכנס בלי עיצוב
       לתוך ה-flex הממרכז את הכרטיס, ונדחק לצד הכרטיס במקום לשבת כתגית
       קבועה בפינה. הכלל הועתק כאן זהה למקור — ראו ההערה שם. */
    .build-stamp {
      position: fixed;
      inset-block-start: 0;
      right: 0;
      z-index: 100000;
      padding: 3px 9px;
      border-radius: 0 0 8px 0;
      background: rgba(20, 42, 34, 0.82);
      color: #DFF3E8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
<div data-build-stamp class="build-stamp" aria-hidden="true">עודכן 18.09 · 14:43</div>
  <!-- ⚠️ 15.9 — "דלג לתוכן המרכזי" (WCAG 2.4.1, רמה A). זהו האלמנט הממוקד
       הראשון בדף: מוסתר מהעין, מופיע בפינה ברגע שמגיעים אליו ב-Tab, ומעביר
       את המיקוד אל <main id="main-content" tabindex="-1">. בלי ה-tabindex
       על היעד הדפדפן מזיז את הגלילה בלבד, המיקוד נשאר על הקישור, וה-Tab
       הבא חוזר לתחילת הניווט — כלומר הקישור לא עושה כלום. -->
  <a class="skip-link" href="#main-content">דלג לתוכן המרכזי</a>
  <main class="card" id="main-content" tabindex="-1">
    <div class="logo" aria-hidden="true">🎉</div>
    <!-- ⚠️ 15.9 — לדף הזה לא הייתה ולו כותרת אחת: הכול היה `div`, וניווט
         לפי כותרות (דרך הניווט העיקרית של קורא מסך) פשוט לא היה קיים.
         ה-`div` הפך ל-`h1` בלי לשנות פיקסל: `.brand` קובע גודל, משקל
         וצבע, ו-`* { margin:0 }` בראש הקובץ מאפס את ברירת המחדל. -->
    <h1 class="brand">ROZIC MOVE</h1>
    <div class="tagline">מזיזים אותך קדימה</div>

    <!-- ⚠️ 15.9 — הטקסט הזה מתחלף מ"מאשרים את התשלום…" לתוצאה בפועל
         (הצליח / נכשל), ועד היום ההחלפה הייתה **חזותית בלבד**: קורא מסך
         הקריא "מאשרים את התשלום…" ואז שתק לנצח. `aria-live="polite"`
         מכריז את הטקסט החדש ברגע שהוא מוחלף. `polite` ולא `alert`, כי
         האזור מכריז גם הצלחה — לא רק כשל. -->
    <div id="status" role="status" aria-live="polite">מאשרים את התשלום…</div>

    <div class="opening" id="opening">
      רגע אחד, בודקים את מצב ההזמנה.
    </div>

    <div class="divider"></div>

    <div id="app-buttons">
      <button tabindex="0" class="btn btn-primary" onclick="openApp()">פתח באפליקציה</button>
      <a tabindex="0" class="btn btn-apple" href="https://apps.apple.com/app/id6783814838">📱 הורד ל-iPhone</a>
      <a tabindex="0" class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.rozicmove.app">🤖 הורד לאנדרואיד</a>
    </div>
    <div id="web-buttons" style="display:none;">
      <a tabindex="0" class="btn btn-primary" id="order-status-link" href="#">צפה בהזמנה שלך</a>
    </div>

    <div class="note" id="note">האפליקציה לא נפתחה אוטומטית? לחץ למעלה ↑</div>

    <footer class="legal-links">
      <a tabindex="0" href="/privacy.html">מדיניות פרטיות</a> ·
      <a tabindex="0" href="/terms.html">תנאי שימוש</a> ·
      <a tabindex="0" href="/accessibility.html">הצהרת נגישות</a> ·
      <a tabindex="0" href="/delete-account.html">מחיקת חשבון</a>
    </footer>
  </main>

  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    /**
     * מעדכן את הודעת המצב **ואת כותרת הדף** באותה נשימה.
     *
     * שניהם אומרים ללקוח אם שילם או לא, ולכן הם חייבים להשתנות
     * יחד: כותרת שנשארת מאחור היא הצהרה שגויה על כסף — בלשונית,
     * בהיסטוריה ובסימנייה — גם אחרי שהדף עצמו תיקן את עצמו.
     *
     * `titleText` נפרד מהטקסט שעל המסך כדי שלשונית תיכנס גרסה קצרה.
     */
    function setStatus(statusText, titleText) {
      document.getElementById('status').textContent = statusText;
      document.title = 'ROZIC MOVE — ' + (titleText || statusText);
    }

    function openApp() {
      var orderId = getParam('orderId');
      window.location.href = 'rozicmove://payment-success' + (orderId ? ('?orderId=' + encodeURIComponent(orderId)) : '');
    }

    /**
     * ⚠️ 18.9 — **טיפ שחוזר מהסליקה נחת כאן ונפל בין הכיסאות.**
     *
     * טיפ מהאתר נשלח ל-Grow עם המזהה `tip_<orderId>_<ts>` (ראו
     * `startTipCheckout` ב-`app/payments.js`) — התחילית היא מה שמנתב
     * אותו ב-`createGrowCheckout` וב-`growNotify` אל האוסף `orderTips`.
     * הדף הזה, לעומת זאת, חיפש **תמיד** `orders/<orderId>`:
     *
     * - מסמך בשם `tip_...` אינו קיים ב-`orders`, ולכן שש הסקירות היו
     *   נכשלות תמיד והלקוח היה מקבל "עדיין מאשרים" גם על טיפ שנגבה;
     * - והקישור "צפה בהזמנה שלך" היה מצביע ל-
     *   `order-status.html?id=tip_...` — הזמנה שאינה קיימת.
     *
     * שניהם נפתרים מאותה פירוק: `tip_<orderId>_<timestamp>`. ההזמנה
     * היא כל מה שביניהם, ולכן `slice(1, -1).join('_')` ולא `split[1]`
     * — מזהה הזמנה עשוי להכיל `_` בעצמו.
     *
     * **באפליקציה אין את הבעיה הזו בכלל:** שם המסך נשאר חי מאחורי
     * דפדפן פנימי ו-`waitForTipConfirmed` מאזין ישירות למסמך הטיפ.
     * באתר `location.href` הורס את הדף — ולכן ההמתנה הזו היא המקבילה
     * היחידה, והיא חייבת לסקור את אותו מסמך בדיוק.
     */
    function parseTipId(id) {
      if (!id || id.indexOf('tip_') !== 0) return null;
      var parts = id.split('_');
      if (parts.length < 3) return null;
      var orderId = parts.slice(1, -1).join('_');
      return orderId ? { tipId: id, orderId: orderId } : null;
    }

    // Orders placed from the website (app/apartment.html etc., via
    // createGrowCheckout's `fromWeb` flag) land here in a plain browser tab —
    // there's no app installed in this context, so skip the dead-end deep-link
    // attempt and send the customer straight to their order status page instead.
    /**
     * ⚠️ 15.9 — **הדף הזה הכריז "התשלום התקבל בהצלחה!" בלי לבדוק דבר.**
     * זו הייתה מחרוזת קשיחה ב-HTML.
     *
     * ולא מדובר במקרה קצה: `createGrowCheckout` מעביר ל-Grow **רק**
     * `successUrl` — אין URL לכשל או לביטול — ולכן **כל** חזרה מהסליקה
     * נוחתת כאן ומכריזה הצלחה, גם כשהתשלום נכשל.
     *
     * ⚠️ וגם בנתיב התקין ה-redirect מקדים את ה-webhook: הלקוח קרא
     * "התקבל בהצלחה", לחץ "צפה בהזמנה שלך", ופגש **"שלם עכשיו — ₪X"**.
     * שני מסכים עוקבים שסותרים זה את זה על כסף, והשני מזמין תשלום כפול.
     *
     * עכשיו הדף קורא את ההזמנה בפועל. הניסוח הפותח הוא "מאשרים את
     * התשלום…" — נייטרלי, כי ברגע הנחיתה **באמת לא ידוע**.
     */
    if (getParam('web') === '1') {
      var checkoutId = getParam('orderId');
      var tip = parseTipId(checkoutId);
      var linkOrderId = tip ? tip.orderId : checkoutId;
      document.getElementById('app-buttons').style.display = 'none';
      document.getElementById('web-buttons').style.display = 'block';
      document.getElementById('note').style.display = 'none';
      document.getElementById('order-status-link').href = 'app/order-status.html' + (linkOrderId ? ('?id=' + encodeURIComponent(linkOrderId)) : '');
      if (tip) verifyTipPayment(tip.tipId);
      else if (checkoutId) verifyPayment(checkoutId);
      else {
        setStatus('התשלום נשלח');
        document.getElementById('opening').textContent = 'אפשר לבדוק את מצב ההזמנה בעמוד ההזמנות.';
      }
    } else {
      setTimeout(openApp, 400);
    }

    /**
     * ⚠️ ה-webhook של Grow יכול לאחר בכמה שניות אחרי ה-redirect, ולכן
     * יש כאן ניסיונות חוזרים ולא קריאה אחת. אחרי ~12 שניות מפסיקים
     * ואומרים את האמת — "עדיין מאשרים" — ולא מכריזים כשל: התשלום
     * עשוי בהחלט להיות תקין, רק האישור טרם הגיע.
     */
    /**
     * סקירה חוזרת של מסמך אחד עד שהוא מסומן כשולם.
     *
     * הוצא מ-`verifyPayment` כדי שנתיב הטיפ (`orderTips`) יחלוק את
     * **אותה** המתנה: אותן שש סקירות, אותה המתנה ל-Auth, ואותו כלל
     * "אחרי ~12 שניות אומרים 'עדיין מאשרים' ולא מכריזים כשל".
     *
     * @returns {Promise<boolean>} האם אושר בתוך זמן הסקירה.
     */
    async function pollPaid(collectionName, docId, isPaid) {
      var fb = await import('./app/firebase.js');
      var fs = await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js');
      var fa = await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js');
      /**
       * ⚠️ בלי ההמתנה הזאת **כל קריאה נפלה ל-catch**, והדף אמר "לא
       * הצלחנו לאמת" גם כשהכל תקין. Firebase Auth משחזר את הסשן
       * אסינכרונית, ו-`getDoc` שרץ לפניו נדחה על הרשאה — בדיוק
       * כשהלקוח חוזר מהסליקה, כלומר בטעינה טרייה של הדף.
       */
      await new Promise(function (resolve) {
        var un = fa.onAuthStateChanged(fb.auth, function () { un(); resolve(); });
        setTimeout(resolve, 4000);  // לא נתקעים אם ה-SDK לא עונה
      });
      for (var i = 0; i < 6; i++) {
        var snap = await fs.getDoc(fs.doc(fb.db, collectionName, docId));
        if (snap.exists() && isPaid(snap.data())) return true;
        await new Promise(function (r) { setTimeout(r, 2000); });
      }
      return false;
    }

    /**
     * טיפ למוביל — אותו מסלול המתנה, על `orderTips/{tipId}`.
     *
     * הסטטוס מתהפך ל-`'paid'` **רק** ע"י `growNotify` (Admin SDK), אותה
     * פונקציה שמזכה את המוביל ומעדכנת `tipAmount` על ההזמנה. כלומר מה
     * שנקרא כאן הוא עובדה מהשרת, לא ה-redirect של Grow — ה-redirect
     * מגיע לפני ה-webhook, וזו בדיוק הסיבה שיש כאן סקירה ולא הצהרה.
     *
     * ⚠️ **ולקוח שסוגר את הדף באמצע אינו מאבד ואינו מסתכן בכלום:**
     * מסמך הטיפ נשאר `pending_payment`, ההזמנה לא נגעה, והמוביל לא
     * זוכה — בדיוק כמו באפליקציה כש-`waitForTipConfirmed` מבוטלת.
     * ואם Grow כן חייבה, `growNotify` תשלים את הזיכוי בשרת בלי קשר
     * לשאלה איזה דף פתוח.
     */
    async function verifyTipPayment(tipId) {
      var openEl = document.getElementById('opening');
      try {
        var paid = await pollPaid('orderTips', tipId, function (d) { return d.status === 'paid'; });
        if (paid) {
          setStatus('הטיפ נשלח למוביל!', 'הטיפ נשלח');
          openEl.textContent = 'תודה — הסכום נזקף לרווחי המוביל.';
          return;
        }
        setStatus('הטיפ נשלח — עדיין מאשרים', 'עדיין מאשרים את הטיפ');
        openEl.textContent = 'האישור מהסליקה יכול לקחת עוד רגע. '
          + 'הטיפ יופיע בפירוט ההזמנה ברגע שיאושר, ואם הוא עדיין לא מופיע '
          + 'בעוד כמה דקות — כדאי לפנות לתמיכה לפני ששולחים שוב.';
      } catch (e) {
        // ⚠️ כשל קריאה אינו כשל תשלום. הניסוח לא מכריז לשום כיוון.
        setStatus('הטיפ נשלח', 'מצב התשלום');
        openEl.textContent = 'לא הצלחנו לאמת את המצב מכאן. הטיפ יופיע בפירוט ההזמנה ברגע שיאושר.';
      }
    }

    async function verifyPayment(orderId) {
      var openEl = document.getElementById('opening');
      try {
        var paid = await pollPaid('orders', orderId, function (d) { return d.paymentStatus === 'paid'; });
        if (paid) {
          setStatus('התשלום התקבל בהצלחה!', 'התשלום התקבל');
          openEl.textContent = 'ההזמנה שלך אושרה.';
          return;
        }
        setStatus('התשלום נשלח — עדיין מאשרים', 'עדיין מאשרים את התשלום');
        openEl.textContent = 'האישור מהסליקה יכול לקחת עוד רגע. '
          + 'אפשר לבדוק את מצב ההזמנה בעמוד ההזמנות, ואם היא עדיין מופיעה '
          + 'כממתינה לתשלום בעוד כמה דקות — כדאי לפנות לתמיכה לפני שמשלמים שוב.';
      } catch (e) {
        // ⚠️ כשל קריאה אינו כשל תשלום. הניסוח לא מכריז לשום כיוון.
        setStatus('התשלום נשלח', 'מצב התשלום');
        openEl.textContent = 'לא הצלחנו לאמת את המצב מכאן. אפשר לבדוק בעמוד ההזמנות.';
      }
    }
