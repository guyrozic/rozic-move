<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROZIC MOVE — אימות מייל</title>
  <!--
    ⚠️ 15.9 — הדף היה חסום ב-robots.txt ב-`Disallow` בלבד.
    `Disallow` מונע **זחילה**, לא **אינדוקס**: גוגל עדיין מאנדקס כתובת
    שהגיעה אליו מקישור חיצוני, ומציג אותה בלי תיאור. גרוע מכך — כל עוד
    הזחילה חסומה, גוגל לעולם לא יקרא `noindex` שיתווסף כאן, כי הוא לא
    ייכנס לדף כדי לראות אותו. לכן שורת ה-`Disallow` הוסרה מ-robots.txt
    והחסימה עברה לתגית הזו, שהיא היחידה שבאמת מוציאה מהאינדקס.
    `follow` — הקישורים המשפטיים שבפוטר כן ראויים למעקב.
  -->
  <meta name="robots" content="noindex, follow">

  <!-- Open Graph / Twitter — קישור לדף הזה הוצג עד היום בלי כותרת,
       בלי תיאור ובלי תצוגה מקדימה בכל מקום שמשתפים אותו. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ROZIC MOVE">
  <meta property="og:locale" content="he_IL">
  <meta property="og:url" content="https://rozicmove.com/verify-redirect.html">
  <meta property="og:title" content="אימות מייל — ROZIC MOVE">
  <meta property="og:description" content="אימות כתובת המייל לחשבון ROZIC MOVE.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="אימות מייל — ROZIC MOVE">
  <meta name="twitter:description" content="אימות כתובת המייל לחשבון ROZIC MOVE.">
  <!-- 15.9 — תמונת השיתוף. המקור: scripts/og-image.svg, נבנית מחדש ב-node scripts/make-og-image.mjs -->
  <meta property="og:image" content="https://rozicmove.com/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="לוגו ROZIC MOVE על רקע ירוק כהה, עם הסלוגן &quot;מזיזים אותך קדימה&quot;">
  <meta name="twitter:image" content="https://rozicmove.com/og-image.png">
  <meta name="twitter:image:alt" content="לוגו ROZIC MOVE על רקע ירוק כהה, עם הסלוגן &quot;מזיזים אותך קדימה&quot;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(160deg, #C8EDD8 0%, #E0F5E9 50%, #F0FAF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFF;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(14,92,67,0.15);
    }
    .logo { font-size: 47px; margin-bottom: 12px; }
    .brand { font-size: 25px; font-weight: 900; color: #0E5C43; margin-bottom: 6px; }
    /* 15.9 — #888 על לבן = 3.54:1, מתחת לסף. #6E6E6E => 5.0:1 */
    .tagline { font-size: 17px; color: #6E6E6E; margin-bottom: 28px; }
    .divider { height: 1px; background: #E0F0E8; margin: 20px 0; }
    .opening { font-size: 18px; color: #555; line-height: 29px; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Heebo', sans-serif;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #0E5C43; color: #FFF; }
    .btn-apple { background: #000; color: #FFF; }
    .btn-android { background: #1D3557; color: #FFF; }
    .btn:hover { opacity: 0.9; }
    /* ⚠️ 15.9 ביקורת נגישות — #AAA על לבן נמדד 2.32:1, הרחק מתחת ל-4.5
       הנדרש לטקסט רגיל. #767676 הוא הגוון הכהה ביותר שעדיין נקרא "אפור
       משני" ועומד בסף (4.54:1). שלושת הדפים האלה מחזיקים CSS משלהם ולא
       נכללו בסבב שעבר על שאר האתר. */
    .note { font-size: 13px; color: #767676; margin-top: 16px; }
    #status { font-size: 16px; color: #0E5C43; font-weight: 600; margin-bottom: 16px; }

    /* פוטר משפטי — הצהרת הנגישות חייבת להיות נגישה מכל דף.
       יושב בתוך הכרטיס, כי ה-body כאן ממורכז ב-flex. */
    /* ⚠️ 15.9 — הגוון היה #BBB, כלומר 1.92:1 על לבן. הוא צובע את המפרידים
       "·" שבין הקישורים — טקסט מרונדר לכל דבר, ולכן כפוף ל-4.5:1 כמו כל
       טקסט אחר. #767676 הוא הגוון הבהיר ביותר שעדיין עובר (4.54:1).
       הקישורים עצמם נושאים #40604F ולא הושפעו. */
    .legal-links {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #E0F0E8;
      font-size: 13px;
      line-height: 25px;
      color: #767676;
    }
    /* ⚠️ 15.9 — יעד הנגיעה היה 19px, מתחת ל-24×24 (WCAG 2.2, 2.5.8) —
       וזה כלל את הקישור להצהרת הנגישות עצמה. אותו תיקון בדיוק נעשה
       בפוטר הראשי ב-11.9 ולא הגיע לשלושת הדפים האלה.
       padding אנכי, לא min-height, כדי לא לשנות פריסה. */
    .legal-links a { color: #40604F; text-decoration: none; display: inline-block; padding-block: 4px; }
    .legal-links a:hover { text-decoration: underline; }

    /* --- נגישות מקלדת: טבעת מיקוד נראית --- */
    /* אותה טבעת בדיוק כמו בשאר האתר (`--green` = #0E5C43). הדף הזה מחזיק
       CSS משלו ואינו טוען את style.css, ולכן הכלל נוסף כאן מקומית.
       `outline` בלבד — אינו תופס מקום בפריסה, ולכן שום דבר לא זז. */
    a:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible { outline: 3px solid #0E5C43; outline-offset: 2px; }

    /* ⚠️ 15.9 — "דלג לתוכן המרכזי" (WCAG 2.4.1, רמה A).
       הדף הזה אינו טוען את style.css, ולכן הכלל משוכפל כאן בערכים
       גולמיים שזהים לטוקנים: --green ‏#0E5C43, --white ‏#FFFFFF,
       --radius-sm ‏10px. שינוי באחד מהם חייב לעבור גם כאן.
       לא display:none — זה היה מוציא את הקישור מסדר ה-Tab ומבטל אותו. */
    .skip-link {
      position: fixed;
      top: -120px;
      inset-inline-start: 16px;
      z-index: 10000;
      padding: 12px 22px;
      border-radius: 0 0 10px 10px;
      background: #0E5C43;
      color: #FFFFFF;            /* 7.98:1 על #0E5C43 */
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      text-decoration: none;
      box-shadow: 0 16px 32px rgba(20,42,34,0.18);
      transition: top 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .skip-link:focus { top: 0; }
    .skip-link:focus-visible { outline: 3px solid #FFFFFF; outline-offset: -6px; }
    @media (prefers-reduced-motion: reduce) { .skip-link { transition: none; } }

    /* ⚠️ 16.9 — `.build-stamp` מוגדר רק ב-style.css, שהדף הזה לא טוען.
       בלעדיו ה-div שנוסף אוטומטית ע"י stamp-assets.mjs נכנס בלי עיצוב
       לתוך ה-flex הממרכז את הכרטיס, ונדחק לצד הכרטיס במקום לשבת כתגית
       קבועה בפינה. הכלל הועתק כאן זהה למקור — ראו ההערה שם. */
    .build-stamp {
      position: fixed;
      inset-block-start: 0;
      right: 0;
      z-index: 100000;
      padding: 3px 9px;
      border-radius: 0 0 8px 0;
      background: rgba(20, 42, 34, 0.82);
      color: #DFF3E8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
<div data-build-stamp class="build-stamp" aria-hidden="true">עודכן 18.09 · 10:19</div>
  <!-- ⚠️ 15.9 — "דלג לתוכן המרכזי" (WCAG 2.4.1, רמה A). זהו האלמנט הממוקד
       הראשון בדף: מוסתר מהעין, מופיע בפינה ברגע שמגיעים אליו ב-Tab, ומעביר
       את המיקוד אל <main id="main-content" tabindex="-1">. בלי ה-tabindex
       על היעד הדפדפן מזיז את הגלילה בלבד, המיקוד נשאר על הקישור, וה-Tab
       הבא חוזר לתחילת הניווט — כלומר הקישור לא עושה כלום. -->
  <a class="skip-link" href="#main-content">דלג לתוכן המרכזי</a>
  <main class="card" id="main-content" tabindex="-1">
    <div class="logo" aria-hidden="true">✅</div>
    <!-- ⚠️ 15.9 — לדף הזה לא הייתה ולו כותרת אחת: הכול היה `div`, וניווט
         לפי כותרות (דרך הניווט העיקרית של קורא מסך) פשוט לא היה קיים.
         ה-`div` הפך ל-`h1` בלי לשנות פיקסל: `.brand` קובע גודל, משקל
         וצבע, ו-`* { margin:0 }` בראש הקובץ מאפס את ברירת המחדל. -->
    <h1 class="brand">ROZIC MOVE</h1>
    <div class="tagline">מזיזים אותך קדימה</div>

    <!-- 15.9 — אותו דפוס כמו ב-payment-success: הטקסט מתחלף לתוצאת
         האימות ולא הוכרז. ראו ההערה שם. -->
    <div id="status" role="status" aria-live="polite">מאמת את המייל שלך...</div>

    <div class="opening" id="opening">
      תוכל לחזור לאפליקציה כדי להמשיך.
    </div>

    <div class="divider"></div>

    <div id="app-buttons">
      <button tabindex="0" class="btn btn-primary" onclick="openApp()">פתח באפליקציה</button>
      <a tabindex="0" class="btn btn-apple" href="https://apps.apple.com/app/id6783814838">📱 הורד ל-iPhone</a>
      <a tabindex="0" class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.rozicmove.app">🤖 הורד לאנדרואיד</a>
    </div>
    <div id="web-buttons" style="display:none;">
      <a tabindex="0" class="btn btn-primary" id="continue-link" href="#">להמשך בחשבון שלי</a>
    </div>

    <div class="note" id="note">אין לך את האפליקציה? הורד בחינם ↑</div>

    <footer class="legal-links">
      <a tabindex="0" href="/privacy.html">מדיניות פרטיות</a> ·
      <a tabindex="0" href="/terms.html">תנאי שימוש</a> ·
      <a tabindex="0" href="/accessibility.html">הצהרת נגישות</a> ·
      <a tabindex="0" href="/delete-account.html">מחיקת חשבון</a>
    </footer>
  </main>

  <script>
    var statusEl = document.getElementById('status');

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    // The app's own verification flow sets continueUrl to this exact page (self-
    // referential — not a useful signal). The website's flow (app/auth.js) points it
    // at app/account.html instead, so any *other* continueUrl means "came from the
    // website" and should land there instead of trying the rozicmove:// deep link.
    /**
     * ⚠️ `continueUrl` מגיע מה-query string, כלומר מכל מי ששולח את הקישור.
     * הוא נכתב גם ל-`window.location.href` (openApp) וגם ל-`href` של כפתור
     * "להמשך בחשבון שלי" — ולכן בלי אימות הוא גם `javascript:` שרץ על
     * rozicmove.com, וגם הפניה פתוחה לדף פישינג מקישור שנראה לגיטימי לגמרי.
     *
     * שני היעדים הלגיטימיים היחידים הם על הדומיין הזה: הדף הזה עצמו
     * (זרימת האפליקציה — מוחזר null בכוונה) ו-app/account.html (זרימת
     * האתר, ראו app/auth.js). לכן בדיקת same-origin אינה שוברת דבר,
     * ומחזירה URL מוחלט ומנורמל במקום את המחרוזת הגולמית.
     */
    function webContinueUrl() {
      var raw = getParam('continueUrl');
      if (!raw) return null;
      try {
        var decoded = decodeURIComponent(raw);
        // בסיס מפורש: מנטרל סכימות (javascript:/data:) וגם URL יחסי מטעה.
        var u = new URL(decoded, window.location.origin);
        if (u.protocol !== window.location.protocol) return null;
        if (u.host !== window.location.host) return null;
        return /\/verify-redirect\.html$/.test(u.pathname) ? null : u.href;
      } catch { return null; }
    }

    function openApp() {
      var webUrl = webContinueUrl();
      if (webUrl) { window.location.href = webUrl; return; }
      window.location.href = 'rozicmove://verified';
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.style.color = '#C13434';
    }

    function showSuccess(message) {
      statusEl.textContent = message;
      statusEl.style.color = '#0E5C43';
      setTimeout(openApp, 800);
    }

    var webUrl = webContinueUrl();
    if (webUrl) {
      document.getElementById('opening').textContent = 'תוכל לחזור לחשבון שלך כדי להמשיך.';
      document.getElementById('app-buttons').style.display = 'none';
      document.getElementById('web-buttons').style.display = 'block';
      document.getElementById('note').style.display = 'none';
      document.getElementById('continue-link').href = webUrl;
    }

    (function verifyEmail() {
      var mode = getParam('mode');
      var oobCode = getParam('oobCode');
      var apiKey = getParam('apiKey');

      var fromWeb = !!webUrl;
      var restart = fromWeb ? 'בקש קישור אימות חדש מתוך החשבון שלך באתר.' : 'בקש קישור אימות חדש מתוך האפליקציה.';
      var goBack = fromWeb ? 'אפשר לחזור לחשבון שלך באתר.' : 'אפשר לחזור לאפליקציה.';

      if (mode !== 'verifyEmail' || !oobCode || !apiKey) {
        showError('קישור לא תקין. ' + restart);
        return;
      }

      fetch('https://identitytoolkit.googleapis.com/v1/accounts:update?key=' + encodeURIComponent(apiKey), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oobCode: oobCode })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error((data.error && data.error.message) || 'VERIFY_FAILED');
            return data;
          });
        })
        .then(function () {
          showSuccess('המייל שלך אומת בהצלחה! ' + (fromWeb ? 'עובר לחשבון שלך...' : 'פותח את האפליקציה...'));
        })
        .catch(function (err) {
          if (String(err.message).indexOf('EXPIRED_OOB_CODE') !== -1) {
            showError('הקישור פג תוקף. ' + restart);
          } else if (String(err.message).indexOf('INVALID_OOB_CODE') !== -1) {
            showError('הקישור כבר נוצל, או שהמייל כבר מאומת. ' + goBack);
          } else {
            showError('אירעה שגיאה באימות המייל. נסה שוב מאוחר יותר.');
          }
        });
    })();
  </script>
</body>
</html>
