<style>
  /* ⚠️ כל צבע טקסט בדף חייב לבוא מטוקן, כולל במצב כהה —

  :root {

  .btn.secondary {

  }
  .stores { margin-top: 22px; font-size: 15px; }
  .stores a { color: var(--brand-text); }
  /* ⚠️ 25.9 (70.6א) — היו קישורי טקסט ערומים (צבע בלבד, בלי מסגרת/ריפוד),
     לעומת `.btn-store` המלא שמשמש לאותה מטרה (הורדת האפליקציה) בכל דף
     אחר באתר. גיא הכריע: עקביות עם הרכיב הקיים גוברת על מחלקה חדשה.
     הדף הזה עצמאי (בלי `style.css`, `:root` נפרד + מצב כהה משלו) —
     ולכן זו העתקה של המבנה והשם (אייקון+טקסט דו-שורתי, פיל מעוגל) עם
     טוקני הדף המקומיים, ולא קישור לגיליון הראשי. `--pine`+לבן ו-
     `--btn-secondary-bg`+`--brand-text`+`--pine-light` הם אותם שני
     הצבעים שכפתור `.btn`/`.btn.secondary` כאן משתמשים בהם, ולכן הניגודיות
     כבר נמדדת ע"י `check-a11y` על הרכיבים האלה — לא צבע רביעי. */
  .stores-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .btn-store {
    display: inline-flex; align-items: center; gap: 0.5em;

    text-decoration: none; font-size: 0.92rem;

  .btn-store svg { width: 1.25em; height: auto; flex-shrink: 0; }
  .btn-store div { text-align: start; line-height: 1.2; }
  .btn-store small { font-size: .78em; opacity: .75; display: block; }
  .btn-store strong { font-size: 1.1em; font-weight: 800; }
  .btn-store.btn-apple { background: var(--pine); color: #fff; }
  .btn-store.btn-google {

  .btn-store:focus-visible { outline: 2px solid var(--pine-light); outline-offset: 2px; }
  .bad { color: var(--danger); }
  /* קישור הדילוג — מוסתר עד שהוא מקבל מיקוד מהמקלדת. */
  .skip-link {

    transition: top .15s ease-in-out;
  }
  .skip-link:focus { top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .skip-link { transition: none; }

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token = params.get('t');

  var title = document.getElementById('title');
  var msg   = document.getElementById('msg');
  var open  = document.getElementById('open');
  var stores = document.getElementById('stores');

  if (!token) {
    title.textContent = 'קישור לא תקין';
    title.className = 'bad';
    msg.textContent = 'הקישור חסר או נקטע. בקשו מהתמיכה לשלוח אותו שוב.';
    open.hidden = true;
    stores.hidden = false;
    return;
  }

  // הטוקן מועבר כמו שהוא לאפליקציה. שום דבר כאן לא מפרש אותו ולא שולח
  // אותו לשרת — ראו ההערה בראש הקובץ.
  var deepLink = 'rozicmove://verify?t=' + encodeURIComponent(token);
  open.setAttribute('href', deepLink);

  // ניסיון פתיחה מיידי. אם האפליקציה מותקנת, הדפדפן עובר אליה ומה שלמטה
  // כבר לא נראה. אם לא — אחרי רגע מציגים את קישורי החנויות.
  location.href = deepLink;

  setTimeout(function () {
    if (document.hidden) return;   // עברנו לאפליקציה — לא להחליף טקסט מאחור
    title.textContent = 'לחץ כדי להמשיך';
    msg.textContent = 'האימות מתבצע בתוך האפליקציה.';
    stores.hidden = false;
  }, 1800);
})();
</script>
